const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const ndc = new THREE.Vector2();
const tmpVec = new THREE.Vector3();

function pickTile(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  if (raycaster.ray.intersectPlane(groundPlane, tmpVec)) return worldToTile(tmpVec.x, tmpVec.z);
  return null;
}

function pickPriorityTarget(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const targetPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.4);
  const hit = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(targetPlane, hit)) return false;

  let best = null, bestD2 = 2.0 * 2.0;
  for (const e of enemies) {
    if (e.hp <= 0) continue;
    const dx = e.pos.x - hit.x, dz = e.pos.z - hit.z;
    const d2 = dx*dx + dz*dz;
    if (d2 < bestD2) { bestD2 = d2; best = e; }
  }
  for (const bs of bosses) {
    if (bs.hp <= 0) continue;
    const dx = bs.pos.x - hit.x, dz = bs.pos.z - hit.z;
    const d2 = dx*dx + dz*dz;
    if (d2 < bestD2 * 3) { bestD2 = d2; best = bs; }
  }
  if (best) {
    priorityTarget = best;
    showSaveToast(`已锁定：${best.isBoss ? best.name : '敌人'}`);
    return true;
  }
  return false;
}

let selectedType = null, ghostRot = 0, ghostMesh = null;
const ghostMatOK = new THREE.MeshBasicMaterial({ color: 0x46e0ff, transparent: true, opacity: 0.32, depthWrite: false });
const ghostMatBad = new THREE.MeshBasicMaterial({ color: 0xff4060, transparent: true, opacity: 0.32, depthWrite: false });
let hoverTile = null, isDragging = false;
let holdBuilding = null, holdTime = 0, holdTile = null;
let inspectedBuilding = null;
const keys = {};

function selectType(type) {
  if (type && !isBuildingUnlocked(type)) return;
  selectedType = type;
  ghostRot = 0;
  document.querySelectorAll('.build-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.type === type);
  });
  rebuildGhost();
}

function rebuildGhost() {
  if (ghostMesh) { scene.remove(ghostMesh); ghostMesh = null; }
  if (!selectedType) return;
  ghostMesh = createBuildingMesh(selectedType);
  ghostMesh.traverse(o => {
    if (o.isMesh) { o.material = ghostMatOK; o.castShadow = false; o.receiveShadow = false; }
  });
  scene.add(ghostMesh);
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (state.gameOver || !gameStarted) return;
  if (e.button !== 0) return;
  const t = pickTile(e.clientX, e.clientY);
  if (!t) return;
  const b = buildingAt(t.gx, t.gz);
  if (b) {
    if (b.type === 'base') { showInspector(b); return; }
    holdBuilding = b; holdTime = 0; holdTile = t;
  } else {
    // 未选中建筑类型时点击空地 → 检查是否点击敌人
    if (!selectedType) {
      if (pickPriorityTarget(e.clientX, e.clientY)) return;
      // 取消优先目标
      if (priorityTarget) {
        priorityTarget = null;
        showSaveToast('已取消锁定');
        return;
      }
      return;
    }
    isDragging = true;
    tryPlaceAt(t.gx, t.gz);
  }
});

window.addEventListener('pointerup', (e) => {
  if (e.button !== 0) return;
  if (holdBuilding && holdTime < 0.45) showInspector(holdBuilding);
  holdBuilding = null; holdTile = null; isDragging = false;
});

window.addEventListener('pointermove', (e) => {
  if (!gameStarted) return;
  hoverTile = pickTile(e.clientX, e.clientY);
  if (holdBuilding) {
    if (!hoverTile || hoverTile.gx !== holdTile.gx || hoverTile.gz !== holdTile.gz) {
      holdBuilding = null; holdTile = null;
    }
  } else if (isDragging && hoverTile) {
    tryPlaceAt(hoverTile.gx, hoverTile.gz);
  }
});

renderer.domElement.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (!gameStarted) return;
  const t = pickTile(e.clientX, e.clientY);
  if (!t) { selectType(null); hideInspector(); return; }
  const b = buildingAt(t.gx, t.gz);
  if (b) showInspector(b);
  else { selectType(null); hideInspector(); }
});

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  camZoom = THREE.MathUtils.clamp(camZoom * (e.deltaY > 0 ? 0.9 : 1.1), 0.55, 2.4);
}, { passive: false });

window.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key.toLowerCase() === 's') {
    e.preventDefault();
    if (gameStarted && saveGame()) showSaveToast('已保存');
    return;
  }
  if (!gameStarted) return;
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'r') {
    if (selectedType && BUILDING_DEFS[selectedType].rotatable) ghostRot = (ghostRot + 1) % 4;
    else if (!selectedType && inspectedBuilding && BUILDING_DEFS[inspectedBuilding.type].rotatable) rotateBuilding(inspectedBuilding);
  }
  if (e.key === 'Escape') { selectType(null); hideInspector(); priorityTarget = null; }
  const n = parseInt(e.key);
  if (e.key === '0') selectType(PALETTE[9]);
  else if (n >= 1 && n <= 9) selectType(PALETTE[n - 1]);
});

window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

function tryPlaceAt(gx, gz) {
  if (!selectedType) return;
  const def = BUILDING_DEFS[selectedType];
  if (!canPlace(selectedType, gx, gz)) return;
  if (!canAfford(def.cost)) return;
  payCost(def.cost);
  addBuilding(selectedType, gx, gz, ghostRot);
  playBuildSound();
  updateUI();
}

function rotateBuilding(b) {
  if (!BUILDING_DEFS[b.type].rotatable) return;
  b.rot = (b.rot + 1) % 4;
  b.mesh.rotation.y = -b.rot * Math.PI / 2;
  if (inspectedBuilding === b) showInspector(b);
}

/* ═══════════════════════════════════════════════════════════
   23. 存档
   ═══════════════════════════════════════════════════════════ */
function saveGame() {
  if (!baseBuilding || state.gameOver) return false;
  const data = {
    version: 2,
    timestamp: Date.now(),
    state: {
      iron: state.iron, copper: state.copper, coal: state.coal, stone: state.stone,
      ironOre: state.ironOre, copperOre: state.copperOre,
      researchPoints: state.researchPoints,
      techs: { ...state.techs },
      difficulty: state.difficulty,
      wave: state.wave, waveTimer: state.waveTimer,
      inWave: state.inWave, spawnRemaining: state.spawnRemaining, spawnTimer: state.spawnTimer,
    },
    tileType: Array.from(tileType),
    buildings: buildings.map(b => ({
      type: b.type, gx: b.gx, gz: b.gz, rot: b.rot,
      hp: b.hp, maxHp: b.maxHp, level: b.level,
      ironBuffer: b.ironBuffer, copperBuffer: b.copperBuffer,
      processing: b.processing, lastProcessed: b.lastProcessed,
      liquidStorage: { ...b.liquidStorage },
      fuel: b.fuel, charge: b.charge,
    })),
    cam: { x: camTarget.x, z: camTarget.z, zoom: camZoom },
  };
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    return true;
  } catch (e) { console.error('Save failed:', e); return false; }
}

function hasSave() {
  try { return !!localStorage.getItem(SAVE_KEY); } catch(e) { return false; }
}
function deleteSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
}

function loadGame() {
  let data;
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    data = JSON.parse(raw);
  } catch (e) { return false; }

  clearAllScene();
  if (data.tileType) {
    for (let i = 0; i < data.tileType.length && i < tileType.length; i++) tileType[i] = data.tileType[i];
  }
  buildTerrainMesh();

  // 恢复 state
  const s = data.state;
  state.iron = s.iron ?? 40; state.copper = s.copper ?? 40;
  state.coal = s.coal ?? 15; state.stone = s.stone ?? 60;
  state.ironOre = s.ironOre || 0; state.copperOre = s.copperOre || 0;
  state.researchPoints = s.researchPoints || 0;
  state.techs = s.techs || {};
  state.difficulty = s.difficulty || 'hard';
  state.wave = s.wave || 0;
  state.waveTimer = s.waveTimer ?? 60;
  state.inWave = s.inWave || false;
  state.spawnRemaining = s.spawnRemaining || 0;
  state.spawnTimer = s.spawnTimer || 0;
  state.gameOver = false;

  // 重建建筑
  for (const bd of data.buildings) {
    const b = addBuilding(bd.type, bd.gx, bd.gz, bd.rot, true);
    b.hp = bd.hp; b.maxHp = bd.maxHp;
    b.level = bd.level || 1;
    if (b.level === 2) addUpgradeMarker(b);
    if (b.type === 'battery' && b.level === 2) b.maxCharge = BATTERY_MAX_CHARGE * 2;
    if (bd.type === 'base') baseBuilding = b;
    if (bd.ironBuffer !== undefined) b.ironBuffer = bd.ironBuffer;
    if (bd.copperBuffer !== undefined) b.copperBuffer = bd.copperBuffer;
    if (bd.processing) b.processing = bd.processing;
    if (bd.lastProcessed) b.lastProcessed = bd.lastProcessed;
    if (bd.liquidStorage) b.liquidStorage = { ...bd.liquidStorage };
    if (bd.fuel !== undefined) b.fuel = bd.fuel;
    if (bd.charge !== undefined) b.charge = bd.charge;
  }

  if (data.cam) {
    camTarget.x = data.cam.x;
    camTarget.z = data.cam.z;
    camZoom = data.cam.zoom || 1;
  }
  updateCamera();
  refreshPalette();
  refreshTechPanel();
  return true;
}

function clearAllScene() {
  for (const b of [...buildings]) {
    scene.remove(b.mesh);
    b.mesh.traverse(o => { if (o.isMesh && o.geometry) o.geometry.dispose?.(); });
  }
  buildings.length = 0;
  for (const type in buildingsByType) buildingsByType[type].length = 0;
  occupancy.clear();
  baseBuilding = null;

  for (const e of enemies) scene.remove(e.mesh);
  enemies.length = 0;
  for (const bs of bosses) {
    scene.remove(bs.mesh);
    for (const leg of bs.legs) {
      scene.remove(leg.thighMesh); scene.remove(leg.shinMesh); scene.remove(leg.footMesh);
    }
    if (bs.breathCone) scene.remove(bs.breathCone);
  }
  bosses.length = 0;
  for (const bl of bullets) scene.remove(bl.mesh);
  bullets.length = 0;
  for (const p of particles) { scene.remove(p.mesh); p.mat.dispose(); }
  particles.length = 0;
  for (const x of explosions) scene.remove(x.mesh);
  explosions.length = 0;
  for (const x of arcBeams) scene.remove(x.mesh);
  arcBeams.length = 0;
  for (const x of shockwaves) scene.remove(x.mesh);
  shockwaves.length = 0;
  for (const d of demolishMeshes) scene.remove(d.mesh);
  demolishMeshes.length = 0;
  priorityTarget = null;

  removeTerrainMesh();
}

const elBtnContinue = $('btnContinue'), elBtnDeleteSave = $('btnDeleteSave');
const elPanelBuild = $('panelBuild'), elPanelTech = $('panelTech');
const elTechBadge = $('techBadge');

// 建筑栏
PALETTE.forEach((type, i) => {
  const def = BUILDING_DEFS[type];
  const ic = PALETTE_ICONS[type];
  const btn = document.createElement('button');
  btn.className = 'build-btn';
  btn.dataset.type = type;
  const keyLabel = i < 9 ? String(i + 1) : i === 9 ? '0' : '';
  btn.innerHTML = `
    <div class="btn-icon" style="--c1:${ic.c1};--c2:${ic.c2};--glow:${ic.glow}"></div>
    <div class="btn-name">${def.name}</div>
    ${keyLabel ? `<div class="btn-key">${keyLabel}</div>` : ''}
    <div class="btn-cost">
      ${def.cost.iron ? `<span class="c-iron">铁${def.cost.iron}</span>` : ''}
      ${def.cost.copper ? `<span class="c-copper">铜${def.cost.copper}</span>` : ''}
      ${def.cost.stone ? `<span class="c-stone">石${def.cost.stone}</span>` : ''}
    </div>
  `;
  btn.addEventListener('click', () => { playClickSound(); selectType(selectedType === type ? null : type); });
  elPanelBuild.appendChild(btn);
});

// 科技面板
function refreshTechPanel() {
  elPanelTech.innerHTML = '';
  for (const techId of TECH_ORDER) {
    const tech = TECH_TREE[techId];
    if (!isTechVisible(techId)) continue;
    const owned = !!state.techs[techId];
    const available = isTechAvailable(techId);
    const div = document.createElement('div');
    div.className = 'tech-item ' + (owned ? 'owned' : available ? 'available' : 'locked');
    div.innerHTML = `
      <div class="tech-header">
        <div class="tech-name">${tech.name}</div>
        <div class="tech-cost">${tech.cost} 点</div>
      </div>
      <div class="tech-desc">${tech.desc}</div>
      <div class="tech-unlocks">
        ${tech.unlocks.map(u => `<span class="tech-unlock-tag">${BUILDING_DEFS[u].name}</span>`).join('')}
      </div>
      <div class="tech-status">${owned ? '已拥有' : available ? '可研究' : '未解锁'}</div>
    `;
    if (!owned && available) {
      div.addEventListener('click', () => researchTech(techId));
    }
    elPanelTech.appendChild(div);
  }
}

function refreshPalette() {
  document.querySelectorAll('.build-btn').forEach(btn => {
    const type = btn.dataset.type;
    const unlocked = isBuildingUnlocked(type);
    btn.classList.toggle('locked', !unlocked);
    if (!unlocked && selectedType === type) selectType(null);
  });
}

// 面板 Tab 切换
document.querySelectorAll('.panel-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    playClickSound();
    const target = tab.dataset.tab;
    document.querySelectorAll('.panel-tab').forEach(t => t.classList.toggle('active', t === tab));
    elPanelBuild.style.display = target === 'build' ? 'grid' : 'none';
    elPanelTech.style.display = target === 'tech' ? 'flex' : 'none';
  });
});

function updateUI() {
  elIron.textContent = Math.floor(state.iron);
  elCopper.textContent = Math.floor(state.copper);
  elCoal.textContent = Math.floor(state.coal);
  elStone.textContent = Math.floor(state.stone);
  elResearch.textContent = state.researchPoints;
  elWave.textContent = state.wave;

  if (state.inWave) {
    elWaveCd.textContent = `敌人 ${enemies.length + state.spawnRemaining}`;
    elWaveCd.classList.remove('warning', 'danger');
    elWaveCd.style.color = '#ff7a8a';
    elWaveCd.style.textShadow = '0 0 14px rgba(255, 120, 140, 0.6)';
  } else {
    const secs = Math.ceil(state.waveTimer);
    elWaveCd.textContent = `${secs}s`;
    elWaveCd.style.color = '';
    elWaveCd.style.textShadow = '';
    elWaveCd.classList.toggle('warning', secs <= 15 && secs > 7);
    elWaveCd.classList.toggle('danger', secs <= 7);
  }

  if (bosses.length > 0) {
    const boss = bosses[0];
    elBossBox.classList.add('show');
    elBossName.textContent = boss.name;
    elBossFill.style.width = Math.max(0, (boss.hp / boss.maxHp) * 100) + '%';
  } else {
    elBossBox.classList.remove('show');
  }

  const hpPct = baseBuilding ? (baseBuilding.hp / baseBuilding.maxHp) * 100 : 0;
  elHpFill.style.width = Math.max(0, hpPct) + '%';
  elHpFill.style.background = hpPct > 60
    ? 'linear-gradient(90deg, #46e0ff, #4cffb0)'
    : hpPct > 25
      ? 'linear-gradient(90deg, #ffb454, #ff8a3d)'
      : 'linear-gradient(90deg, #ff5a6e, #ff2040)';

  document.querySelectorAll('.build-btn').forEach(btn => {
    const def = BUILDING_DEFS[btn.dataset.type];
    btn.classList.toggle('poor', !canAfford(def.cost) || !isBuildingUnlocked(btn.dataset.type));
  });

  // 研究点徽章
  elTechBadge.textContent = state.researchPoints;
  elTechBadge.classList.toggle('hot', state.researchPoints > 0);
}

function showInspector(b) {
  if (!b) return;
  inspectedBuilding = b;
  const def = BUILDING_DEFS[b.type];
  let extra = '';

  if (b.type === 'conveyor') {
    extra = `<div class="insp-row"><span>朝向</span><span>${DIR_NAMES[b.rot]}</span></div>
      <div class="insp-row"><span>载物</span><span>${b.item ? ITEM_INFO[b.item.kind].name : '空'}</span></div>`;
  } else if (b.type === 'mine') {
    const oreType = tileType[idx(b.gx, b.gz)];
    const oreName = oreType === ORE_IRON ? '铁矿' : oreType === ORE_COPPER ? '铜矿' : oreType === ORE_COAL ? '煤矿' : '无';
    extra = `<div class="insp-row"><span>矿脉</span><span>${oreName}</span></div>
      <div class="insp-row"><span>效率</span><span>${b.powered ? '×4 ⚡' : '×1'}${b.level === 2 ? ' ×2 🏅' : ''}</span></div>`;
  } else if (b.type === 'furnace') {
    const procName = b.processing ? ITEM_INFO[b.processing].name : '空闲';
    extra = `<div class="insp-row"><span>状态</span><span>${procName}</span></div>
      <div class="insp-row"><span>铁矿石</span><span>${b.ironBuffer}</span></div>
      <div class="insp-row"><span>铜矿石</span><span>${b.copperBuffer}</span></div>
      <div class="insp-row"><span>效率</span><span>${b.powered ? '×4 ⚡' : '×1'}${b.level === 2 ? ' ×2 🏅' : ''}</span></div>`;
  } else if (b.type === 'liquefier') {
    let lines = '';
    const keys = ALL_ITEM_KINDS.filter(k => b.liquidStorage[k] > 0);
    if (!keys.length) lines = `<div class="insp-row"><span>储液</span><span>空</span></div>`;
    else for (const k of keys) lines += `<div class="insp-row"><span>${ITEM_INFO[k].name}</span><span>${b.liquidStorage[k]}</span></div>`;
    extra = lines;
  } else if (b.type === 'pipe') {
    extra = `<div class="insp-row"><span>作用</span><span>液体传输</span></div>`;
  } else if (b.type === 'powerplant') {
    const burn = b.level === 2 ? 20 : 10;
    extra = `<div class="insp-row"><span>燃料</span><span>${b.fuel} / ${b.maxFuel} 煤</span></div>
      <div class="insp-row"><span>燃烧周期</span><span>${burn}s${b.level === 2 ? ' 🏅' : ''}</span></div>
      <div class="insp-row"><span>状态</span><span>${b.active ? '运行中 ⚡' : '缺煤'}</span></div>`;
  } else if (b.type === 'cable') {
    extra = `<div class="insp-row"><span>作用</span><span>电力传输</span></div>`;
  } else if (b.type === 'gridgen') {
    const r = b.level === 2 ? GRIDGEN_RADIUS_LV2 : GRIDGEN_RADIUS;
    const cnt = buildings.filter(x => !x.disabled &&
      Math.abs(x.gx - b.gx) <= r && Math.abs(x.gz - b.gz) <= r).length;
    extra = `<div class="insp-row"><span>范围</span><span>${r * 2}×${r * 2}${b.level === 2 ? ' 🏅' : ''}</span></div>
      <div class="insp-row"><span>覆盖建筑</span><span>${cnt}</span></div>
      <div class="insp-row"><span>状态</span><span style="color:${b.powered ? '#7dffb0' : '#ff7a8a'}">${b.powered ? '供电中 ⚡' : '未通电'}</span></div>`;
  } else if (b.type === 'battery') {
    const pct = Math.round((b.charge / b.maxCharge) * 100);
    extra = `<div class="insp-row"><span>电量</span><span>${pct}%${b.level === 2 ? ' 🏅' : ''}</span></div>
      <div class="insp-row"><span>状态</span><span>${b.charge > 0 ? (b.isCharging ? '充电中 ⚡' : '供电中') : '无电'}</span></div>
      <div class="insp-row"><span>警告</span><span style="color:#ff7a8a">被摧毁时爆炸</span></div>`;
  } else if (b.type === 'turret') {
    const lvlMul = b.level === 2 ? 1.4 : 1;
    extra = `<div class="insp-row"><span>射程</span><span>${TURRET_RANGE}</span></div>
      <div class="insp-row"><span>伤害</span><span>${TURRET_DMG}</span></div>
      <div class="insp-row"><span>射速</span><span>${(b.powered ? TURRET_RATE * 4 * lvlMul : TURRET_RATE * lvlMul).toFixed(1)} / 秒${b.powered ? ' ⚡' : ''}${b.level === 2 ? ' 🏅' : ''}</span></div>`;
  } else if (b.type === 'highcannon') {
    const eff = b.powered ? HIGH_POWER_MUL : 1;
    const lvlMul = b.level === 2 ? 1.4 : 1;
    const dmg = TURRET_DMG * HIGH_DMG_MUL * eff * lvlMul;
    const rate = TURRET_RATE * HIGH_RATE_MUL * eff * lvlMul;
    extra = `<div class="insp-row"><span>射程</span><span>${TURRET_RANGE}</span></div>
      <div class="insp-row"><span>伤害</span><span>${dmg} / 发${b.powered ? ' (×16)' : ' (×4)'}${b.level === 2 ? ' 🏅' : ''}</span></div>
      <div class="insp-row"><span>射速</span><span>${rate.toFixed(1)} / 秒${b.powered ? ' ⚡' : ''}</span></div>`;
  } else if (b.type === 'arccannon') {
    extra = `<div class="insp-row"><span>射程</span><span>${ARC_RANGE}</span></div>
      <div class="insp-row"><span>伤害</span><span>${ARC_DMG}${b.level === 2 ? ' ×1.5 🏅' : ''}</span></div>
      <div class="insp-row"><span>最大目标</span><span>${ARC_MAX_TARGETS}</span></div>
      <div class="insp-row"><span>供电</span><span style="color:${b.powered ? '#7dffb0' : '#ff7a8a'}">${b.powered ? '已通电 ⚡' : '必须通电'}</span></div>`;
  } else if (b.type === 'base') {
    extra = `<div class="insp-row"><span>说明</span><span>不可拆除</span></div>`;
  }

  const rotBtn = def.rotatable
    ? `<button class="insp-btn" id="inspRotate">↻ 旋转至 ${DIR_NAMES[(b.rot + 1) % 4]} (R)</button>`
    : '';

  // 升级按钮
  let upgradeHTML = '';
  if (!UNUPGRADABLE.has(b.type)) {
    const canUpgrade = b.level < 2;
    const cost = UPGRADES[b.type];
    if (canUpgrade && cost) {
      const affordable = canAfford(cost);
      const costStr = Object.entries(cost)
        .map(([k, v]) => `${k === 'iron' ? '铁' : k === 'copper' ? '铜' : '石'}${v}`).join(' ');
      upgradeHTML = `<button class="insp-btn upgrade" id="inspUpgrade" ${affordable ? '' : 'disabled'}>
        ⬆ 升级至 Lv.2 · ${costStr}
      </button>`;
    } else if (b.level >= 2) {
      upgradeHTML = `<button class="insp-btn upgrade" disabled>🏅 已满级 Lv.2</button>`;
    }
  }

  const lvlBadge = b.level === 2 ? `<span class="lvl-badge">Lv.2 🏅</span>` : '';

  elInspector.innerHTML = `
    <div id="inspTitle">${def.name}${lvlBadge}</div>
    <div id="inspSub">坐标 ${b.gx}, ${b.gz}${b.powered ? ' · 已通电 ⚡' : ''}${b.disabled ? ' · <span style="color:#ff7a8a">已瘫痪</span>' : ''}</div>
    <div class="insp-row"><span>耐久</span><span>${Math.ceil(b.hp)} / ${Math.ceil(b.maxHp)}</span></div>
    ${extra}
    ${upgradeHTML}
    ${rotBtn}
  `;
  elInspector.classList.add('show');

  const rotBtnEl = $('inspRotate');
  if (rotBtnEl) rotBtnEl.addEventListener('click', (e) => { e.stopPropagation(); playClickSound(); rotateBuilding(b); });
  const upgradeBtn = $('inspUpgrade');
  if (upgradeBtn && !upgradeBtn.disabled) {
    upgradeBtn.addEventListener('click', (e) => { e.stopPropagation(); upgradeBuilding(b); });
  }
}

function hideInspector() { elInspector.classList.remove('show'); inspectedBuilding = null; }

function triggerGameOver() {
  if (state.gameOver) return;
  state.gameOver = true;
  elGoText.textContent = `你坚持到了第 ${state.wave} 波`;
  elGameOver.classList.add('show');
  deleteSave();
  playExplosionSound(2.5);
}

function showSaveToast(text = '已保存') {
  elSaveToast.textContent = text;
  elSaveToast.classList.add('show');
  clearTimeout(showSaveToast._tid);
  showSaveToast._tid = setTimeout(() => elSaveToast.classList.remove('show'), 1400);
}

/* ═══════════════════════════════════════════════════════════
   25. 主循环
   ═══════════════════════════════════════════════════════════ */
function updateGhost() {
  if (!ghostMesh || !selectedType) return;
  if (!hoverTile || !inBounds(hoverTile.gx, hoverTile.gz)) { ghostMesh.visible = false; return; }
  ghostMesh.visible = true;
  const def = BUILDING_DEFS[selectedType];
  const [w, h] = def.size;
  ghostMesh.position.set(hoverTile.gx - HALF + w / 2, 0, hoverTile.gz - HALF + h / 2);
  ghostMesh.rotation.y = -ghostRot * Math.PI / 2;
  const ok = canPlace(selectedType, hoverTile.gx, hoverTile.gz) && canAfford(def.cost);
  const mat = ok ? ghostMatOK : ghostMatBad;
  ghostMesh.traverse(o => { if (o.isMesh) o.material = mat; });
}

function updateCameraInput(dt) {
  const speed = 15 / camZoom;
  const mx = (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0);
  const mz = (keys['s'] ? 1 : 0) - (keys['w'] ? 1 : 0);
  if (mx || mz) {
    const move = _v3a.set(0, 0, 0);
    if (mz !== 0) move.addScaledVector(camForwardFlat, -mz);
    if (mx !== 0) move.addScaledVector(camRightFlat, mx);
    if (move.lengthSq() > 0) {
      move.normalize().multiplyScalar(speed * dt);
      camTarget.x = THREE.MathUtils.clamp(camTarget.x + move.x, -HALF - 1, HALF + 1);
      camTarget.z = THREE.MathUtils.clamp(camTarget.z + move.z, -HALF - 1, HALF + 1);
    }
  }
}

let lastTime = performance.now();

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  if (gameStarted && !state.gameOver) {
    updateCameraInput(dt);
    beltTexture.offset.x -= dt * 1.3;

    // 重置标记
    for (const b of buildings) b.disabled = false;

    // 分派建筑逻辑
    for (const c of buildingsByType.conveyor) updateConveyor(c, dt);
    for (const m of buildingsByType.mine) updateMine(m, dt);
    for (const f of buildingsByType.furnace) updateFurnace(f, dt);
    for (const p of buildingsByType.powerplant) updatePowerPlant(p, dt);
    for (const b of buildingsByType.battery) updateBatteryVisual(b, dt, now);
    for (const t of buildingsByType.turret) updateTurret(t, dt);
    for (const h of buildingsByType.highcannon) updateHighCannon(h, dt);
    for (const a of buildingsByType.arccannon) updateArcCannon(a, dt);

    // 电力 + 管道
    updatePowerNetwork(dt);
    updatePipeNetwork();

    // 修复 / 视觉
    for (const b of buildings) {
      if (b.powered && b.hp < b.maxHp && !b.pendingRemove)
        b.hp = Math.min(b.maxHp, b.hp + REPAIR_RATE * dt);

      // 电力指示环
      if (b.powerRing) {
        b.powerRing.visible = b.powered && !b.disabled;
        if (b.powered) {
          b.powerRing.rotation.z += dt * 1.5;
          b.powerRing.material.opacity = 0.4 + Math.sin(now * 0.005) * 0.2;
        }
      }

      // 物品视觉
      if (b.type === 'conveyor' && b.item) updateItemVisual(b);

      // 建筑特定动画
      switch (b.type) {
        case 'cable':
          if (b.mesh.userData.node) b.mesh.userData.node.scale.setScalar(1 + Math.sin(now * 0.006) * 0.12);
          break;
        case 'gridgen':
          if (b.mesh.userData.top) b.mesh.userData.top.rotation.y += dt * 2;
          if (b.mesh.userData.aura) b.mesh.userData.aura.rotation.z += dt * 0.8;
          break;
        case 'pipe':
          if (b.mesh.userData.liquidNode) b.mesh.userData.liquidNode.scale.setScalar(1 + Math.sin(now * 0.008) * 0.25);
          break;
        case 'base':
          if (b.mesh.userData.spinRing) b.mesh.userData.spinRing.rotation.z += dt * 0.8;
          break;
        case 'liquefier':
          updateLiquefierVisual(b, now);
          break;
      }

      // 建造动画
      if (b.buildAnim) {
        b.buildAnim.t += dt;
        const t = Math.min(1, b.buildAnim.t / b.buildAnim.duration);
        const e = 1 - Math.pow(1 - t, 3);
        b.mesh.scale.set(e, e, e);
        b.mesh.position.y = (1 - e) * -0.4;
        if (t >= 1) {
          b.buildAnim = null;
          b.mesh.scale.set(1, 1, 1);
          b.mesh.position.y = 0;
        }
      }
      // 升级标记浮动
      if (b.upgradeMarker) {
        b.upgradeMarker.position.y = Math.max(b.w, b.h) * 0.9 + 0.7 + Math.sin(now * 0.003) * 0.08;
        b.upgradeMarker.rotation.y += dt * 2;
      }
      updateBuildingAppearance(b);
    }

    updateBullets(dt);
    updateEnemies(dt);
    updateBosses(dt, now);
    updateWaves(dt);
    updateParticles(dt);

    // 长按拆除
    if (holdBuilding) {
      holdTime += dt;
      if (holdTime >= 0.45) {
        const target = holdBuilding;
        holdBuilding = null; holdTile = null;
        removeBuilding(target, true);
        playExplosionSound(0.4);
        spawnDeathParticles(tileCenterX(target.gx), 0.4, tileCenterZ(target.gz), 0x88aaff, 5);
      }
    }

    // 处理 pendingRemove
    for (let i = buildings.length - 1; i >= 0; i--) {
      if (buildings[i].pendingRemove) removeBuilding(buildings[i], true);
    }

    // 自动保存
    autosaveTimer += dt;
    if (autosaveTimer >= AUTOSAVE_INTERVAL) {
      autosaveTimer = 0;
      if (saveGame()) showSaveToast('自动保存');
    }
  }

  // 拆除动画
  for (let i = demolishMeshes.length - 1; i >= 0; i--) {
    const d = demolishMeshes[i];
    d.t += dt;
    const t = Math.min(1, d.t / d.duration);
    const e = 1 - t;
    d.mesh.scale.set(e, e, e);
    d.mesh.position.y = t * -0.6;
    d.mesh.rotation.y += dt * 6;
    if (t >= 1) { scene.remove(d.mesh); demolishMeshes.splice(i, 1); }
  }

  // 爆炸
  for (let i = explosions.length - 1; i >= 0; i--) {
    const e = explosions[i];
    e.t += dt;
    const t = Math.min(1, e.t / e.duration);
    e.mesh.scale.setScalar(1 + t * 6);
    e.mesh.material.opacity = 1 - t;
    if (t >= 1) {
      scene.remove(e.mesh); e.mesh.geometry.dispose(); e.mesh.material.dispose();
      explosions.splice(i, 1);
    }
  }

  // 电弧
  for (let i = arcBeams.length - 1; i >= 0; i--) {
    const a = arcBeams[i];
    a.t += dt;
    const t = Math.min(1, a.t / a.duration);
    a.mesh.material.opacity = 0.9 * (1 - t);
    a.mesh.scale.x = 1 + t * 0.5; a.mesh.scale.z = 1 + t * 0.5;
    if (t >= 1) {
      scene.remove(a.mesh); a.mesh.geometry.dispose(); a.mesh.material.dispose();
      arcBeams.splice(i, 1);
    }
  }

  // 冲击波
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const s = shockwaves[i];
    s.t += dt;
    const t = Math.min(1, s.t / s.duration);
    s.mesh.scale.setScalar(1 + t * 8);
    s.mesh.material.opacity = 1 - t;
    if (t >= 1) {
      scene.remove(s.mesh); s.mesh.geometry.dispose(); s.mesh.material.dispose();
      shockwaves.splice(i, 1);
    }
  }

  if (gameStarted) {
    updateGhost();
    updateCamera();
    updateUI();
  }

  renderer.render(scene, camera);
}

/* ═══════════════════════════════════════════════════════════
   26. 初始化 / 流程
   ═══════════════════════════════════════════════════════════ */
function startNewGame(difficulty) {
  clearAllScene();

  // 重置 state
  Object.assign(state, {
    iron: 40, copper: 40, coal: 15, stone: 60,
    ironOre: 0, copperOre: 0,
    researchPoints: 0,
    techs: {},
    difficulty: difficulty || 'hard',
    wave: 0,
    waveTimer: difficulty === 'easy' ? 120 : 60,
    inWave: false, spawnRemaining: 0, spawnTimer: 0,
    gameOver: false,
  });
  priorityTarget = null;

  generateTerrain();
  buildTerrainMesh();

  const bgx = GRID / 2 - 1, bgz = GRID / 2 - 1;
  baseBuilding = addBuilding('base', bgx, bgz, 0, true);

  camTarget.set(0, 0, 0);
  camZoom = 1;
  updateCamera();

  selectType('mine');
  hideInspector();
  elGameOver.classList.remove('show');

  refreshPalette();
  refreshTechPanel();
  updateUI();

  autosaveTimer = 0;
  gameStarted = true;
}

function continueGame() {
  if (loadGame()) {
    selectType('mine');
    hideInspector();
    elGameOver.classList.remove('show');
    autosaveTimer = 0;
    gameStarted = true;
    updateUI();
  } else {
    startNewGame('hard');
  }
}

function updateTitleButtons() {
  const has = hasSave();
  elBtnContinue.disabled = !has;
  elBtnDeleteSave.disabled = !has;
}

// 标题界面：新游戏 → 选择难度
function showDifficultySelect() {
  playClickSound();
  const overlay = document.createElement('div');
  overlay.style.cssText = `position:fixed;inset:0;z-index:250;display:flex;align-items:center;
    justify-content:center;flex-direction:column;gap:16px;
    background:rgba(5,8,14,0.9);backdrop-filter:blur(8px);`;
  overlay.innerHTML = `
    <div style="font-size:24px;letter-spacing:6px;color:#7ee8ff;font-weight:800;">选择难度</div>
    <div style="font-size:12px;color:#7b8ba3;letter-spacing:2px;margin-bottom:8px;">简单模式下每波间隔翻倍</div>
    <div style="display:flex;gap:16px;">
      <button id="diffEasy" class="diff-btn">简单<span class="diff-sub">波次间隔 ×2</span></button>
      <button id="diffHard" class="diff-btn">困难<span class="diff-sub">标准节奏</span></button>
    </div>
    <button id="diffCancel" style="margin-top:12px;padding:8px 24px;background:transparent;
      border:1px solid rgba(120,140,160,0.4);border-radius:8px;color:#7b8ba3;
      font-family:inherit;font-size:12px;cursor:pointer;letter-spacing:1px;">取消</button>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#diffEasy').onclick = () => {
    playClickSound();
    overlay.remove();
    if (hasSave() && !confirm('已有存档，开始新游戏会覆盖旧存档。是否继续？')) return;
    deleteSave();
    elTitleScreen.classList.add('hide');
    startNewGame('easy');
  };
  overlay.querySelector('#diffHard').onclick = () => {
    playClickSound();
    overlay.remove();
    if (hasSave() && !confirm('已有存档，开始新游戏会覆盖旧存档。是否继续？')) return;
    deleteSave();
    elTitleScreen.classList.add('hide');
    startNewGame('hard');
  };
  overlay.querySelector('#diffCancel').onclick = () => {
    playClickSound();
    overlay.remove();
  };
}

$('btnNewGame').addEventListener('click', showDifficultySelect);
$('btnContinue').addEventListener('click', () => { playClickSound(); elTitleScreen.classList.add('hide'); continueGame(); });
$('btnDeleteSave').addEventListener('click', () => {
  playClickSound();
  if (!confirm('确定要删除存档吗？')) return;
  deleteSave();
  updateTitleButtons();
  showSaveToast('存档已删除');
});
$('btnRetry').addEventListener('click', () => {
  playClickSound();
  elGameOver.classList.remove('show');
  const diff = state.difficulty || 'hard';
  deleteSave();
  startNewGame(diff);
});
$('btnBackToTitle').addEventListener('click', () => {
  playClickSound();
  elGameOver.classList.remove('show');
  gameStarted = false;
  elTitleScreen.classList.remove('hide');
  updateTitleButtons();
});

window.addEventListener('blur', () => {
  if (gameStarted && !state.gameOver) saveGame();
});
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  updateCamera();
});

function init() {
  updateTitleButtons();
  updateCamera();
  requestAnimationFrame(animate);
}

init();
</script>
</body>
</html>
