<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory Frontier · 工厂前线</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #06080e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #d8e4f2; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }

  /* ═══ 标题界面 ═══ */
  #titleScreen {
    position: fixed; inset: 0; z-index: 200;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, rgba(30, 80, 120, 0.35), rgba(5, 8, 14, 0.98)),
                linear-gradient(180deg, #0a1018, #06080e);
    transition: opacity .6s ease, visibility .6s; overflow: hidden;
  }
  #titleScreen.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  #titleScreen::before {
    content: ''; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(70, 224, 255, 0.04) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(70, 224, 255, 0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
    animation: gridDrift 24s linear infinite;
  }
  @keyframes gridDrift { from { background-position: 0 0; } to { background-position: 48px 48px; } }
  .title-wrap { position: relative; text-align: center; padding: 30px 40px; z-index: 2; }
  .title-logo { font-size: 62px; font-weight: 900; letter-spacing: 8px; margin: 0;
    background: linear-gradient(135deg, #7ee8ff 0%, #46e0ff 40%, #4cffb0 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 60px rgba(70, 224, 255, 0.5); animation: logoGlow 3s ease-in-out infinite; }
  @keyframes logoGlow { 0%, 100% { filter: drop-shadow(0 0 20px rgba(70, 224, 255, 0.4)); }
    50% { filter: drop-shadow(0 0 40px rgba(70, 224, 255, 0.7)); } }
  .title-sub { font-size: 13px; letter-spacing: 8px; margin: 6px 0 0;
    color: #5f7a99; text-transform: uppercase; font-weight: 500; }
  .title-divider { width: 300px; height: 1px; margin: 22px auto 26px;
    background: linear-gradient(90deg, transparent, rgba(70, 224, 255, 0.5), transparent); }
  .title-buttons { display: flex; flex-direction: column; gap: 12px; align-items: center; margin-top: 8px; }
  .title-btn { min-width: 240px; padding: 15px 34px;
    background: linear-gradient(135deg, rgba(70, 224, 255, 0.15), rgba(70, 224, 255, 0.06));
    border: 1px solid rgba(70, 224, 255, 0.4); border-radius: 12px;
    color: #d8f4ff; font-family: inherit; font-size: 15px; font-weight: 700;
    letter-spacing: 3px; cursor: pointer; transition: all .2s ease;
    position: relative; overflow: hidden; }
  .title-btn::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transform: translateX(-100%); transition: transform .5s ease; }
  .title-btn:hover { border-color: #46e0ff; background: linear-gradient(135deg, rgba(70, 224, 255, 0.3), rgba(70, 224, 255, 0.1));
    transform: translateY(-2px); box-shadow: 0 8px 30px rgba(70, 224, 255, 0.3); }
  .title-btn:hover::after { transform: translateX(100%); }
  .title-btn.primary { background: linear-gradient(135deg, rgba(70, 224, 255, 0.25), rgba(70, 224, 255, 0.08)); }
  .title-btn.danger { border-color: rgba(255, 90, 110, 0.4); color: #ffb8c2; }
  .title-btn.danger:hover { border-color: #ff5a6e; background: linear-gradient(135deg, rgba(255, 90, 110, 0.3), rgba(255, 90, 110, 0.08));
    box-shadow: 0 8px 30px rgba(255, 90, 110, 0.3); }
  .title-btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
  .title-version { position: absolute; bottom: 20px; right: 24px; font-size: 11px; color: #3a4a60; letter-spacing: 2px; }
  .title-footnote { position: absolute; bottom: 20px; left: 24px; font-size: 11px; color: #3a4a60; letter-spacing: 1px; }
  .difficulty-row { display: flex; gap: 12px; margin-top: 4px; }
  .diff-btn { min-width: 116px; padding: 12px 20px;
    background: rgba(70, 224, 255, 0.08); border: 1px solid rgba(70, 224, 255, 0.3);
    border-radius: 11px; color: #b8e0f0; font-family: inherit; font-size: 13px; font-weight: 700;
    letter-spacing: 2px; cursor: pointer; transition: all .2s ease; }
  .diff-btn:hover { border-color: #46e0ff; background: rgba(70, 224, 255, 0.2); transform: translateY(-2px); }
  .diff-btn .diff-sub { display: block; font-size: 9px; color: #7b8ba3; letter-spacing: 1px; margin-top: 3px; font-weight: 500; }

  /* ═══ HUD ═══ */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #hud > * { pointer-events: auto; }

  #topBar { position: absolute; top: 12px; left: 12px; right: 12px;
    display: flex; align-items: flex-start; gap: 12px; pointer-events: none; }
  #topBar > * { pointer-events: auto; }

  #resources { display: flex; gap: 4px;
    background: rgba(10, 16, 26, 0.85);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(70, 224, 255, 0.16);
    border-radius: 14px; padding: 7px 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05); }
  .resource { display: flex; align-items: center; gap: 7px; padding: 2px 8px; }
  .resource + .resource { border-left: 1px solid rgba(255,255,255,0.07); }
  .ico { width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.4), 0 0 10px rgba(0,0,0,0.5);
    position: relative; }
  .ico::after { content: ''; position: absolute; inset: 3px; border-radius: 2px;
    background: linear-gradient(135deg, rgba(255,255,255,0.4), transparent 60%); }
  .ico.iron   { background: linear-gradient(160deg, #d0dce8, #6a7a8e); }
  .ico.copper { background: linear-gradient(160deg, #f0a878, #a05020); }
  .ico.coal   { background: linear-gradient(160deg, #55566a, #181820); }
  .ico.stone  { background: linear-gradient(160deg, #8c93a3, #3a4050); }
  .ico.research { background: linear-gradient(160deg, #c0a0ff, #5a3aa8); }
  .resource .value { font-size: 15px; font-weight: 700; color: #eaf4ff;
    font-variant-numeric: tabular-nums; line-height: 1; min-width: 20px; }

  #waveDisplay { position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: rgba(10, 16, 26, 0.85);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(70, 224, 255, 0.16);
    border-radius: 14px; padding: 8px 26px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    min-width: 160px; }
  #waveNum { font-size: 10px; letter-spacing: 3px; color: #7b8ba3;
    text-transform: uppercase; font-weight: 600; }
  #waveNum .num { color: #ffb454; font-size: 13px; }
  #waveCountdown { font-size: 17px; font-weight: 800; color: #7ee8ff;
    font-variant-numeric: tabular-nums; letter-spacing: 1px;
    line-height: 1.1; text-shadow: 0 0 14px rgba(70, 224, 255, 0.5); }
  #waveCountdown.warning { color: #ff8a5a; text-shadow: 0 0 14px rgba(255, 130, 90, 0.6); }
  #waveCountdown.danger { color: #ff5a6e; text-shadow: 0 0 18px rgba(255, 90, 110, 0.7);
    animation: pulse 0.7s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

  #hpBox { margin-left: auto; display: flex; flex-direction: column; gap: 4px;
    background: rgba(10, 16, 26, 0.85);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(70, 224, 255, 0.16);
    border-radius: 14px; padding: 8px 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    min-width: 160px; }
  #hpLabel { font-size: 9px; letter-spacing: 2px; color: #7b8ba3; text-transform: uppercase; font-weight: 600; }
  #hpBar { width: 100%; height: 8px; background: rgba(255,255,255,0.07); border-radius: 4px; overflow: hidden; }
  #hpFill { height: 100%; width: 100%; background: linear-gradient(90deg, #46e0ff, #4cffb0); border-radius: 4px;
    transition: width .25s ease, background .3s; }

  #bossBox { position: absolute; top: 74px; left: 50%; transform: translateX(-50%);
    display: none; flex-direction: column; gap: 3px;
    background: rgba(30, 8, 16, 0.9);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 90, 110, 0.4);
    border-radius: 12px; padding: 8px 18px;
    box-shadow: 0 8px 30px rgba(255, 30, 60, 0.25), inset 0 1px 0 rgba(255,255,255,0.08);
    min-width: 260px; }
  #bossBox.show { display: flex; animation: bossIn .4s ease; }
  @keyframes bossIn { from { opacity: 0; transform: translate(-50%, -8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  #bossName { font-size: 11px; letter-spacing: 3px; color: #ff8a9a;
    text-transform: uppercase; font-weight: 700; text-align: center;
    text-shadow: 0 0 12px rgba(255, 90, 110, 0.6); }
  #bossBar { width: 100%; height: 10px; background: rgba(255,255,255,0.08); border-radius: 5px; overflow: hidden; }
  #bossFill { height: 100%; width: 100%;
    background: linear-gradient(90deg, #ff5a6e, #ff2040, #a80028);
    border-radius: 5px; transition: width .2s ease;
    box-shadow: 0 0 12px rgba(255, 60, 90, 0.6) inset; }

  /* ═══ 左侧面板 ═══ */
  #leftPanel { position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 172px; display: flex; flex-direction: column;
    background: rgba(10, 16, 26, 0.85);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(70, 224, 255, 0.16);
    border-radius: 15px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
    max-height: 88vh; overflow: hidden;
    padding: 8px; }
  #leftPanel::-webkit-scrollbar { width: 4px; }
  #leftPanel::-webkit-scrollbar-thumb { background: rgba(70,224,255,0.3); border-radius: 2px; }

  .panel-tabs { display: flex; gap: 4px; margin-bottom: 8px; flex-shrink: 0; }
  .panel-tab { flex: 1; padding: 6px 0; font-size: 10px; font-weight: 700; letter-spacing: 1px;
    background: rgba(20, 30, 45, 0.7); border: 1px solid rgba(70, 224, 255, 0.14);
    border-radius: 7px; color: #7b8ba3; font-family: inherit; cursor: pointer;
    transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .panel-tab:hover { color: #b8d8e8; border-color: rgba(70, 224, 255, 0.35); }
  .panel-tab.active { color: #7ee8ff; background: rgba(30, 65, 90, 0.9);
    border-color: rgba(70, 224, 255, 0.55); box-shadow: 0 0 12px rgba(70, 224, 255, 0.25); }
  .panel-tab .badge { display: inline-block; padding: 0 5px; border-radius: 5px;
    background: rgba(192, 160, 255, 0.25); color: #d8c0ff; font-size: 9px; font-weight: 800; min-width: 14px; }
  .panel-tab .badge.hot { background: rgba(255, 200, 80, 0.35); color: #ffd060;
    animation: badgePulse 1.4s ease-in-out infinite; }
  @keyframes badgePulse { 0%, 100% { box-shadow: 0 0 0 rgba(255, 200, 80, 0); }
    50% { box-shadow: 0 0 10px rgba(255, 200, 80, 0.8); } }

  .panel-scroll { flex: 1; overflow-y: auto; scrollbar-width: thin;
    scrollbar-color: rgba(70,224,255,0.3) transparent; padding-right: 2px; }

  #panelBuild { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }

  .build-btn { width: 100%; aspect-ratio: 1/1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    position: relative;
    background: rgba(20, 30, 45, 0.75);
    border: 1px solid rgba(70, 224, 255, 0.14);
    border-radius: 10px; cursor: pointer; font-family: inherit;
    color: #d8e4f2; padding: 3px; transition: all .15s ease; }
  .build-btn:hover { border-color: rgba(70, 224, 255, 0.55);
    background: rgba(30, 50, 70, 0.85); transform: translateY(-1px); }
  .build-btn.active { border-color: #46e0ff; background: rgba(30, 65, 90, 0.95);
    box-shadow: 0 0 22px rgba(70, 224, 255, 0.4), inset 0 0 16px rgba(70, 224, 255, 0.12); }
  .build-btn.poor { opacity: 0.35; cursor: not-allowed; }
  .build-btn.poor:hover { transform: none; border-color: rgba(70,224,255,0.14); background: rgba(20,30,45,0.75); }
  .build-btn.locked { opacity: 0.28; cursor: not-allowed; pointer-events: none;
    border-color: rgba(120,120,140,0.2); background: rgba(15, 20, 28, 0.7); }
  .btn-icon { width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0;
    background: linear-gradient(150deg, var(--c1), var(--c2));
    box-shadow: inset 0 -2px 4px rgba(0,0,0,0.45), 0 0 10px var(--glow);
    position: relative; }
  .btn-icon::after { content: ''; position: absolute; inset: 6px;
    border: 2px solid rgba(255,255,255,0.4); border-radius: 3px; }
  .build-btn.locked .btn-icon::after { content: '🔒'; border: none;
    inset: 0; font-size: 16px; display: flex; align-items: center; justify-content: center;
    color: #a0a0b0; }
  .btn-name { font-size: 8px; font-weight: 600; color: #b8c8dc;
    letter-spacing: 0.3px; white-space: nowrap; text-align: center;
    overflow: hidden; max-width: 68px; text-overflow: ellipsis; }
  .build-btn.active .btn-name { color: #7ee8ff; }
  .btn-key { position: absolute; top: 2px; right: 3px;
    font-size: 8px; font-weight: 800; color: #6a8098;
    background: rgba(0,0,0,0.35); border-radius: 3px;
    padding: 0 4px; line-height: 1.3; }
  .build-btn.active .btn-key { color: #7ee8ff; background: rgba(70,224,255,0.18); }
  .btn-cost { position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%);
    display: none; flex-direction: row; gap: 3px;
    font-size: 7px; background: rgba(0,0,0,0.9);
    border-radius: 4px; padding: 2px 5px;
    white-space: nowrap; pointer-events: none; z-index: 3; }
  .build-btn:hover .btn-cost { display: flex; }
  .btn-cost span { font-weight: 700; }
  .c-iron { color: #a8c0d8; } .c-stone { color: #9aa3b5; } .c-copper { color: #e0a070; }

  /* ═══ 科技树 ═══ */
  #panelTech { display: flex; flex-direction: column; gap: 6px; }
  .tech-item { background: rgba(20, 30, 45, 0.7);
    border: 1px solid rgba(70, 224, 255, 0.15);
    border-radius: 9px; padding: 7px 9px; transition: all .15s; cursor: pointer; position: relative; }
  .tech-item:hover { border-color: rgba(70, 224, 255, 0.4); background: rgba(25, 40, 60, 0.8); }
  .tech-item.owned { border-color: rgba(120, 240, 160, 0.5);
    background: linear-gradient(135deg, rgba(30, 70, 50, 0.6), rgba(20, 40, 30, 0.6)); cursor: default; }
  .tech-item.locked { opacity: 0.4; cursor: not-allowed; }
  .tech-item.locked:hover { border-color: rgba(70,224,255,0.15); background: rgba(20, 30, 45, 0.7); }
  .tech-item.available { border-color: rgba(192, 160, 255, 0.5);
    box-shadow: 0 0 12px rgba(192, 160, 255, 0.2); }
  .tech-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
  .tech-name { font-size: 11px; font-weight: 700; color: #c8d8e8; }
  .tech-item.owned .tech-name { color: #a0ffc8; }
  .tech-item.available .tech-name { color: #d8c0ff; }
  .tech-cost { font-size: 10px; font-weight: 700; color: #c0a0ff;
    background: rgba(192, 160, 255, 0.15); border-radius: 5px; padding: 1px 6px; }
  .tech-item.owned .tech-cost { color: #80e0a8; background: rgba(120, 240, 160, 0.15); }
  .tech-desc { font-size: 9px; color: #7b8ba3; line-height: 1.3; }
  .tech-unlocks { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; }
  .tech-unlock-tag { font-size: 8px; padding: 1px 5px; border-radius: 4px;
    background: rgba(70, 224, 255, 0.12); color: #7ee8ff; font-weight: 600; }
  .tech-status { position: absolute; top: 6px; right: 8px; font-size: 9px;
    font-weight: 800; letter-spacing: 1px; }
  .tech-item.owned .tech-status { color: #80e0a8; }
  .tech-item.available .tech-status { color: #d8c0ff; }
  .tech-item.locked .tech-status { color: #808890; }

  /* ═══ 属性面板 ═══ */
  #inspector { position: absolute; bottom: 12px; right: 12px; width: 250px;
    background: rgba(10, 16, 26, 0.92);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(70, 224, 255, 0.2);
    border-radius: 14px; padding: 12px 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.05);
    display: none; max-height: 68vh; overflow-y: auto; }
  #inspector.show { display: block; animation: slideIn .2s ease; }
  @keyframes slideIn { from { opacity:0; transform: translateY(10px);} to {opacity:1; transform:none;} }
  #inspTitle { font-size: 15px; font-weight: 700; color: #7ee8ff; margin-bottom: 3px; letter-spacing: 1px; }
  #inspTitle .lvl-badge { font-size: 10px; color: #ffd060;
    background: rgba(255, 208, 96, 0.15); border-radius: 4px; padding: 1px 5px;
    margin-left: 6px; font-weight: 700; vertical-align: middle; }
  #inspSub { font-size: 9px; color: #5f7089; margin-bottom: 10px; letter-spacing: .5px; }
  .insp-row { display: flex; justify-content: space-between; font-size: 11px; padding: 4px 0;
    border-top: 1px solid rgba(255,255,255,0.06); }
  .insp-row span:first-child { color: #7b8ba3; }
  .insp-row span:last-child { color: #d8e4f2; font-weight: 600; font-variant-numeric: tabular-nums; }

  .insp-btn { width: 100%; margin-top: 8px; padding: 8px;
    background: rgba(70, 224, 255, 0.12);
    border: 1px solid rgba(70, 224, 255, 0.4);
    border-radius: 9px; color: #7ee8ff;
    font-family: inherit; font-size: 11px; font-weight: 700;
    cursor: pointer; letter-spacing: 1px; transition: all .15s;
    display: flex; align-items: center; justify-content: center; gap: 6px; }
  .insp-btn:hover { background: rgba(70, 224, 255, 0.3); border-color: #46e0ff;
    box-shadow: 0 0 16px rgba(70, 224, 255, 0.35); }
  .insp-btn:active { transform: scale(0.97); }
  .insp-btn.upgrade { background: rgba(255, 208, 96, 0.15);
    border-color: rgba(255, 208, 96, 0.5); color: #ffd060; }
  .insp-btn.upgrade:hover { background: rgba(255, 208, 96, 0.3);
    box-shadow: 0 0 16px rgba(255, 208, 96, 0.4); }
  .insp-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .insp-btn:disabled:hover { background: rgba(70, 224, 255, 0.12);
    box-shadow: none; border-color: rgba(70, 224, 255, 0.4); }

  #hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: #56657d; letter-spacing: .5px; white-space: nowrap;
    background: rgba(10,16,26,0.72); padding: 5px 14px; border-radius: 9px;
    backdrop-filter: blur(10px); border: 1px solid rgba(70,224,255,0.08); }

  #saveToast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(20, 80, 50, 0.9);
    border: 1px solid rgba(80, 240, 160, 0.5);
    color: #b0ffd8; font-size: 12px; font-weight: 600;
    padding: 8px 20px; border-radius: 10px; letter-spacing: 1px;
    opacity: 0; pointer-events: none; z-index: 50; transition: opacity .3s ease;
    box-shadow: 0 8px 30px rgba(80, 240, 160, 0.25); }
  #saveToast.show { opacity: 1; }

  #gameover { position: fixed; inset: 0; z-index: 100; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(ellipse at center, rgba(80,0,20,0.6), rgba(5,3,8,0.97));
    backdrop-filter: blur(8px); }
  #gameover.show { display: flex; animation: fadeIn .5s ease; }
  @keyframes fadeIn { from {opacity:0} to {opacity:1} }
  #gameover h1 { font-size: 48px; margin: 0; letter-spacing: 8px; color: #ff5a6e;
    text-shadow: 0 0 50px rgba(255,60,90,0.7); font-weight: 900; }
  #gameover p { color: #9fb0c8; margin: 0; font-size: 15px; letter-spacing: 2px; }
  #gameover .go-buttons { display: flex; gap: 12px; margin-top: 12px; }
  #gameover button { padding: 13px 34px; font-size: 14px; font-weight: 700; letter-spacing: 2px;
    background: linear-gradient(135deg, #46e0ff, #2aa8d8); border: none; border-radius: 11px;
    color: #04121c; cursor: pointer; font-family: inherit;
    box-shadow: 0 8px 30px rgba(70,224,255,0.4); transition: transform .15s; }
  #gameover button:hover { transform: scale(1.05); }
  #gameover button.secondary { background: transparent; border: 1px solid rgba(70,224,255,0.4);
    color: #7ee8ff; box-shadow: none; }
  #gameover button.secondary:hover { background: rgba(70,224,255,0.12); }
</style>
</head>
<body>

<!-- 标题界面 -->
<div id="titleScreen">

/* ═══════════════════════════════════════════════════════════
   2. 音频系统（Web Audio API 合成）
   ═══════════════════════════════════════════════════════════ */
let audioCtx = null;
let audioEnabled = true;
const soundThrottle = {};

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioEnabled = false; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function throttleSound(key, ms) {
  const now = performance.now();
  if (soundThrottle[key] && now - soundThrottle[key] < ms) return false;
  soundThrottle[key] = now;
  return true;
}

function playBuildSound() {
  if (!audioCtx || !audioEnabled) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(180, t);
  osc.frequency.exponentialRampToValueAtTime(520, t + 0.12);
  gain.gain.setValueAtTime(0.09, t);
  gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.22);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.25);
}

function playExplosionSound(size = 1) {
  if (!audioCtx || !audioEnabled) return;
  if (!throttleSound('explosion', 30)) return;
  const t = audioCtx.currentTime;
  const dur = 0.35 * size;
  const bufSize = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufSize, 2.2);
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(900 * size, t);
  filter.frequency.exponentialRampToValueAtTime(90, t + dur);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.18 * Math.min(size, 2), t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(filter).connect(gain).connect(audioCtx.destination);
  src.start(t); src.stop(t + dur + 0.02);
}

function playLaserSound() {
  if (!audioCtx || !audioEnabled) return;
  if (!throttleSound('laser', 45)) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(1400, t);
  osc.frequency.exponentialRampToValueAtTime(180, t + 0.11);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.05, t);
  gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.12);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.14);
}

function playClickSound() {
  if (!audioCtx || !audioEnabled) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(900, t);
  osc.frequency.setValueAtTime(1300, t + 0.03);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.04, t);
  gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.07);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.08);
}

function playUpgradeSound() {
  if (!audioCtx || !audioEnabled) return;
  const t = audioCtx.currentTime;
  [440, 554, 659, 880].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    const start = t + i * 0.055;
    gain.gain.setValueAtTime(0.06, t + i * 0.055);
    gain.gain.exponentialRampToValueAtTime(0.0008, t + i * 0.055 + 0.18);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(start); osc.stop(start + 0.2);
  });
}

function playResearchSound() {
  if (!audioCtx || !audioEnabled) return;
  const t = audioCtx.currentTime;
  [523, 659, 784, 1046].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const start = t + i * 0.07;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(0.07, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0008, start + 0.28);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(start); osc.stop(start + 0.3);
  });
}

  }
  return ITEM_MAT_CACHE[kind];
}

function generateTerrain() {
  tileType.fill(0);
  for (let i = 0; i < 22; i++) {
    let x = 3 + Math.floor(Math.random() * (GRID - 6));
    let z = 3 + Math.floor(Math.random() * (GRID - 6));
    const n = 4 + Math.floor(Math.random() * 7);
    const r = Math.random();
    const type = r < 0.5 ? ORE_IRON : r < 0.8 ? ORE_COAL : ORE_COPPER;
    for (let j = 0; j < n; j++) {
      if (inBounds(x, z)) tileType[idx(x, z)] = type;
      x += Math.floor(Math.random() * 3) - 1;
      z += Math.floor(Math.random() * 3) - 1;
    }
  }
  const bgx = GRID/2 - 1, bgz = GRID/2 - 1;
  for (let dx = -2; dx <= 3; dx++)
    for (let dz = -2; dz <= 3; dz++)
      if (inBounds(bgx + dx, bgz + dz)) tileType[idx(bgx + dx, bgz + dz)] = 0;
}

function removeTerrainMesh() {
  if (terrainMesh) {
    scene.remove(terrainMesh);
    terrainMesh.geometry?.dispose(); terrainMesh.material?.dispose();
    terrainMesh = null;
  }
  for (const m of oreMeshes) {
    scene.remove(m); m.geometry?.dispose(); m.material?.dispose();
  }
  oreMeshes.length = 0;
}

function buildTerrainMesh() {
  const geo = new THREE.BoxGeometry(1, 1, 1); geo.translate(0, -0.5, 0);
  const mat = new THREE.MeshStandardMaterial({ roughness: 0.92, metalness: 0.05 });
  const mesh = new THREE.InstancedMesh(geo, mat, GRID * GRID);
  mesh.receiveShadow = true;
  const m = new THREE.Matrix4(), col = new THREE.Color();
  for (let gz = 0; gz < GRID; gz++) for (let gx = 0; gx < GRID; gx++) {
    const i = idx(gx, gz);
    const h = 0.38 + Math.random() * 0.26;
    m.makeScale(0.985, h, 0.985);
    m.setPosition(tileCenterX(gx), 0, tileCenterZ(gz));
    mesh.setMatrixAt(i, m);
    const v = 0.82 + Math.random() * 0.36;
    const t = tileType[i];
    if (t === ORE_IRON)        col.setRGB(0.42*v, 0.20*v, 0.13*v);
    else if (t === ORE_COPPER) col.setRGB(0.16*v, 0.36*v, 0.32*v);
    else if (t === ORE_COAL)   col.setRGB(0.11*v, 0.11*v, 0.14*v);
    else                       col.setRGB(0.23*v, 0.26*v, 0.33*v);
    mesh.setColorAt(i, col);
  }
  mesh.instanceMatrix.needsUpdate = true;
  mesh.instanceColor.needsUpdate = true;
  scene.add(mesh);
  terrainMesh = mesh;

  const buckets = { 1: [], 2: [], 3: [] };
  for (let gz = 0; gz < GRID; gz++) for (let gx = 0; gx < GRID; gx++) {
    const t = tileType[idx(gx, gz)];
    if (t > 0) buckets[t].push([gx, gz]);
  }
  const style = {
    1: { color: 0xB06040, emissive: 0x5A1A08 },
    2: { color: 0x40C0A8, emissive: 0x0A5A4A },
    3: { color: 0x303040, emissive: 0x18182a },
  };
  for (const type of [1, 2, 3]) {
    const positions = buckets[type];
    if (!positions.length) continue;
    const oreGeo = new THREE.IcosahedronGeometry(0.12, 0);
    const oreMat = new THREE.MeshStandardMaterial({
      color: style[type].color, emissive: style[type].emissive,
      emissiveIntensity: 1.4, roughness: 0.2, metalness: 0.6, flatShading: true,
    });
    const oreMesh = new THREE.InstancedMesh(oreGeo, oreMat, positions.length * 4);
    oreMesh.castShadow = true;
    const om = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
    const v3 = new THREE.Vector3(), s3 = new THREE.Vector3();
    let n = 0;
    for (const [gx, gz] of positions) for (let k = 0; k < 4; k++) {
      const ox = (Math.random() - 0.5) * 0.62, oz = (Math.random() - 0.5) * 0.62;
      const oy = 0.06 + Math.random() * 0.14, s = 0.6 + Math.random() * 0.9;
      v3.set(tileCenterX(gx) + ox, oy, tileCenterZ(gz) + oz);
      e.set(Math.random()*3, Math.random()*3, Math.random()*3);
      q.setFromEuler(e);
      s3.set(s, s * (0.8 + Math.random() * 0.8), s);
      om.compose(v3, q, s3);
      oreMesh.setMatrixAt(n++, om);
    }
    oreMesh.instanceMatrix.needsUpdate = true;
    scene.add(oreMesh);
    oreMeshes.push(oreMesh);
  }
}

/* ═══════════════════════════════════════════════════════════
   8. 连接规则
   ═══════════════════════════════════════════════════════════ */
function getPerimeterCells(b) {
  const cells = [];
  for (let dx = 0; dx < b.w; dx++) {
    cells.push({ gx: b.gx + dx, gz: b.gz - 1 });
    cells.push({ gx: b.gx + dx, gz: b.gz + b.h });
  }
  for (let dz = 0; dz < b.h; dz++) {
    cells.push({ gx: b.gx - 1, gz: b.gz + dz });
    cells.push({ gx: b.gx + b.w, gz: b.gz + dz });
  }
  return cells;
}

function getBuildingOutputCells(b) {
  const outputs = [];
  for (const cell of getPerimeterCells(b)) {
    if (!inBounds(cell.gx, cell.gz)) continue;
    const n = buildingAt(cell.gx, cell.gz);
    if (!n || n === b) continue;
    if (n.type === 'conveyor') {
      const d = DIRS[n.rot];
      const nx = n.gx + d.x, nz = n.gz + d.z;
      if (!tileInBuilding(b, nx, nz)) outputs.push(cell);
    } else if (n.type === 'pipe' && b.type === 'liquefier') {
      outputs.push(cell);
    }
  }
  return outputs;
}

/* ═══════════════════════════════════════════════════════════
   9. 科技 / 建筑解锁
   ═══════════════════════════════════════════════════════════ */
function isBuildingUnlocked(type) {
  if (BASIC_BUILDINGS.includes(type)) return true;
  for (const techId in state.techs) {
    if (state.techs[techId] && TECH_TREE[techId].unlocks.includes(type)) return true;
  }
  return false;
}

function isTechAvailable(techId) {
  if (state.techs[techId]) return false;
  const tech = TECH_TREE[techId];
  for (const req of tech.requires) {
    if (!state.techs[req]) return false;
  }
  return state.researchPoints >= tech.cost;
}

function isTechVisible(techId) {
  const tech = TECH_TREE[techId];
  for (const req of tech.requires) {
    if (!state.techs[req]) return false;
  }
  return true;
}

function researchTech(techId) {
  if (!isTechAvailable(techId)) return;
  const tech = TECH_TREE[techId];
  state.researchPoints -= tech.cost;
  state.techs[techId] = true;
  playResearchSound();
  refreshPalette();
  refreshTechPanel();
  updateUI();
  showSaveToast(`已研究：${tech.name}`);
}

/* ═══════════════════════════════════════════════════════════
   10. 建筑系统
   ═══════════════════════════════════════════════════════════ */
function canPlace(type, gx, gz) {
  const [w, h] = BUILDING_DEFS[type].size;
  for (let dx = 0; dx < w; dx++) for (let dz = 0; dz < h; dz++) {
    const x = gx + dx, z = gz + dz;
    if (!inBounds(x, z)) return false;
    if (occupancy.has(idx(x, z))) return false;
  }
  return true;
}

function canAfford(cost) {
  return state.iron >= (cost.iron || 0) && state.copper >= (cost.copper || 0) &&
         state.stone >= (cost.stone || 0) && state.coal >= (cost.coal || 0);
}

function payCost(cost) {
  state.iron -= cost.iron || 0;
  state.copper -= cost.copper || 0;
  state.stone -= cost.stone || 0;
  state.coal -= cost.coal || 0;
}

function addBuilding(type, gx, gz, rot, skipAnim = false) {
  const def = BUILDING_DEFS[type];
  const [w, h] = def.size;
  const b = {
    type, gx, gz, w, h, rot,
    level: 1,
    hp: def.hp, maxHp: def.hp,
    mesh: null, item: null, timer: 0,
    ironBuffer: 0, copperBuffer: 0, processing: null, lastProcessed: null,
    liquidStorage: {},
    fuel: 0, maxFuel: 10, fuelBurnTimer: 0, active: false,
    charge: 0, maxCharge: BATTERY_MAX_CHARGE, isCharging: false,
    powered: false, disabled: false, cooldown: 0,
    buildAnim: skipAnim ? null : { t: 0, duration: 0.45 },
    meshMaterials: [], pendingRemove: false,
    upgradeMarker: null,
  };
  const wx = gx - HALF + w / 2, wz = gz - HALF + h / 2;
  const mesh = createBuildingMesh(type);
  mesh.position.set(wx, 0, wz);
  mesh.rotation.y = -rot * Math.PI / 2;
  mesh.scale.set(skipAnim ? 1 : 0.01, skipAnim ? 1 : 0.01, skipAnim ? 1 : 0.01);
  scene.add(mesh);
  b.mesh = mesh;

  mesh.traverse(o => {
    if (o.isMesh && o.material) {
      const cloned = o.material.clone();
      b.meshMaterials.push({ mat: cloned, orig: o.material });
      o.material = cloned;
    }
  });

  if (type !== 'base') {
    const ringGeo = new THREE.TorusGeometry(Math.max(w, h) * 0.55, 0.045, 6, 24);
    const ring = new THREE.Mesh(ringGeo, MAT.powerRing.clone());
    ring.rotation.x = Math.PI / 2; ring.position.y = 0.05; ring.visible = false;
    mesh.add(ring);
    b.powerRing = ring;
  }

  for (let dx = 0; dx < w; dx++) for (let dz = 0; dz < h; dz++)
    occupancy.set(idx(gx + dx, gz + dz), b);

  buildings.push(b);
  buildingsByType[type].push(b);
  return b;
}

function removeBuilding(b, animate = true) {
  if (!b || b.type === 'base') return;
  if (b.item) { scene.remove(b.item.mesh); b.item = null; }
  for (let dx = 0; dx < b.w; dx++) for (let dz = 0; dz < b.h; dz++)
    occupancy.delete(idx(b.gx + dx, b.gz + dz));
  const i = buildings.indexOf(b);
  if (i >= 0) buildings.splice(i, 1);
  const arr = buildingsByType[b.type];
  const j = arr.indexOf(b);
  if (j >= 0) arr.splice(j, 1);
  if (animate) demolishMeshes.push({ mesh: b.mesh, t: 0, duration: 0.32 });
  else scene.remove(b.mesh);
  if (inspectedBuilding === b) hideInspector();
}

function damageBuilding(b, amount) {
  if (!b || state.gameOver || b.pendingRemove) return;
  b.hp -= amount;
  if (b.hp <= 0) {
    b.hp = 0;
    if (b.type === 'base') { triggerGameOver(); return; }
    if (b.type === 'battery') batteryExplode(b);
    b.pendingRemove = true;
    playExplosionSound(0.7);
    spawnDeathParticles(tileCenterX(b.gx), 0.6, tileCenterZ(b.gz), 0xff8844, 6);
  }
}

function upgradeBuilding(b) {
  if (!b || b.type === 'base' || b.level >= 2) return false;
  const cost = UPGRADES[b.type];
  if (!cost) return false;
  if (!canAfford(cost)) return false;
  payCost(cost);
  b.level = 2;
  if (b.type === 'battery') b.maxCharge = BATTERY_MAX_CHARGE * 2;
  if (b.type === 'base') b.maxHp *= 1.5;
  // 视觉标记
  addUpgradeMarker(b);
  playUpgradeSound();
  showInspector(b);
  updateUI();
  return true;
}

function addUpgradeMarker(b) {
  if (b.upgradeMarker) return;
  const marker = new THREE.Mesh(new THREE.OctahedronGeometry(0.11), MAT.gold);
  const maxDim = Math.max(b.w, b.h);
  marker.position.y = maxDim * 0.9 + 0.7;
  b.mesh.add(marker);
  b.upgradeMarker = marker;
}

function batteryExplode(battery) {
  const bx = tileCenterX(battery.gx), bz = tileCenterZ(battery.gz);
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
    if (dx === 0 && dz === 0) continue;
    const gx = battery.gx + dx, gz = battery.gz + dz;
    if (!inBounds(gx, gz)) continue;
    const b = buildingAt(gx, gz);
    if (!b || b === battery) continue;
    if (b.type === 'base') damageBuilding(b, 250);
    else damageBuilding(b, 99999);
  }
  for (const e of enemies) {
    if (Math.abs(e.pos.x - bx) <= 1.6 && Math.abs(e.pos.z - bz) <= 1.6) {
      e.hp -= 500; e.hitFlash = 0.15;
    }
  }
  for (const bs of bosses) {
    if (Math.abs(bs.pos.x - bx) <= 1.6 && Math.abs(bs.pos.z - bz) <= 1.6) {
      bs.hp -= 300; bs.hitFlash = 0.2;
    }
  }
  spawnExplosion(bx, 0.5, bz);
  playExplosionSound(1.3);
}

function spawnExplosion(x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.35, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0xffcc44, transparent: true, opacity: 1, depthWrite: false })
  );
  mesh.position.set(x, y, z);
  scene.add(mesh);
  explosions.push({ mesh, t: 0, duration: 0.55 });
}

/* ═══════════════════════════════════════════════════════════
   11. 粒子系统
   ═══════════════════════════════════════════════════════════ */
const particleGeo = new THREE.TetrahedronGeometry(0.09, 0);

function spawnDeathParticles(x, y, z, color = 0xff6a7e, count = 10) {
  for (let i = 0; i < count; i++) {
    const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
    const mesh = new THREE.Mesh(particleGeo, mat);
    mesh.position.set(x, y, z);
    const s = 0.5 + Math.random() * 0.8;
    mesh.scale.setScalar(s);
    scene.add(mesh);
    const life = 0.6 + Math.random() * 0.5;
    particles.push({
      mesh, mat,
      vel: new THREE.Vector3(
        (Math.random() - 0.5) * 4,
        1.5 + Math.random() * 3,
        (Math.random() - 0.5) * 4,
      ),
      spin: new THREE.Vector3(
        (Math.random() - 0.5) * 12,
        (Math.random() - 0.5) * 12,
        (Math.random() - 0.5) * 12,
      ),
      life, maxLife: life,
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      scene.remove(p.mesh);
      p.mesh.geometry === particleGeo || p.mesh.geometry.dispose?.();
      p.mat.dispose();
      particles.splice(i, 1);
      continue;
    }
    // 物理
    p.vel.y -= 9.8 * dt;
    p.mesh.position.x += p.vel.x * dt;
    p.mesh.position.y += p.vel.y * dt;
    p.mesh.position.z += p.vel.z * dt;
    if (p.mesh.position.y < 0.08) {
      p.mesh.position.y = 0.08;
      p.vel.y *= -0.35;
      p.vel.x *= 0.7;
      p.vel.z *= 0.7;
    }
    p.mesh.rotation.x += p.spin.x * dt;
    p.mesh.rotation.y += p.spin.y * dt;
    p.mesh.rotation.z += p.spin.z * dt;
    const alpha = p.life / p.maxLife;
    p.mat.opacity = alpha;
    p.mesh.scale.setScalar(0.5 + alpha * 0.6);
  }
}

/* ═══════════════════════════════════════════════════════════
   12. 物品 / 传送带
   ═══════════════════════════════════════════════════════════ */
function spawnItemMesh(kind, gx, gz, offset) {
  const mesh = new THREE.Mesh(getItemGeo(kind), getItemMat(kind));
  mesh.castShadow = true;
  scene.add(mesh);
  return { kind, gx, gz, offset, mesh };
}

function updateItemVisual(b) {
  const item = b.item;
  if (!item) return;
  const d = DIRS[b.rot];
  item.mesh.position.set(tileCenterX(b.gx) + d.x * item.offset, 0.27, tileCenterZ(b.gz) + d.z * item.offset);
  item.mesh.rotation.y += 0.03; item.mesh.rotation.x += 0.02;
}

function tryAcceptItem(target, item) {
  switch (target.type) {
    case 'conveyor':
      if (!target.item) {
        target.item = item; item.offset = -0.5;
        item.gx = target.gx; item.gz = target.gz;
        return true;
      }
      return false;
    case 'base':
      if (state[item.kind] !== undefined) state[item.kind] += 1;
      scene.remove(item.mesh); return true;
    case 'furnace':
      if (item.kind === 'ironOre' && target.ironBuffer < FURNACE_MAX_BUFFER) {
        target.ironBuffer++; scene.remove(item.mesh); return true;
      }
      if (item.kind === 'copperOre' && target.copperBuffer < FURNACE_MAX_BUFFER) {
        target.copperBuffer++; scene.remove(item.mesh); return true;
      }
      return false;
    case 'powerplant':
      if (item.kind === 'coal' && target.fuel < target.maxFuel) {
        target.fuel++; scene.remove(item.mesh); return true;
      }
      return false;
    case 'liquefier':
      if (!target.liquidStorage[item.kind]) target.liquidStorage[item.kind] = 0;
      target.liquidStorage[item.kind]++;
      scene.remove(item.mesh); return true;
  }
  return false;
}

/* ═══════════════════════════════════════════════════════════
   13. 建筑逻辑（单次遍历优化）
   ═══════════════════════════════════════════════════════════ */
function updateConveyor(b, dt) {
  const item = b.item;
  if (!item) return;
  const speedMul = b.level === 2 ? 1.6 : 1;
  if (item.offset < 0.5) item.offset = Math.min(0.5, item.offset + BELT_SPEED * speedMul * dt);
  if (item.offset >= 0.5) {
    const d = DIRS[b.rot];
    const nx = b.gx + d.x, nz = b.gz + d.z;
    if (!inBounds(nx, nz)) return;
    const target = buildingAt(nx, nz);
    if (!target) return;
    if (tryAcceptItem(target, item)) b.item = null;
  }
}

function updateMine(b, dt) {
  if (b.mesh.userData.drill) b.mesh.userData.drill.rotation.y += dt * 7;
  const powerMul = b.powered ? 4 : 1;
  const levelMul = b.level === 2 ? 2 : 1;
  const period = MINE_PERIOD / (powerMul * levelMul);
  b.timer += dt;
  if (b.timer < period) return;
  b.timer -= period;
  const oreType = tileType[idx(b.gx, b.gz)];
  const kind = oreType === ORE_IRON ? 'ironOre' :
               oreType === ORE_COPPER ? 'copperOre' :
               oreType === ORE_COAL ? 'coal' : 'stone';
  for (const cell of getBuildingOutputCells(b)) {
    const n = buildingAt(cell.gx, cell.gz);
    if (!n) continue;
    if (n.type === 'conveyor' && !n.item) {
      n.item = spawnItemMesh(kind, cell.gx, cell.gz, -0.5);
      return;
    }
  }
}

function tryOutputItem(b, kind) {
  for (const cell of getBuildingOutputCells(b)) {
    const n = buildingAt(cell.gx, cell.gz);
    if (!n) continue;
    if (n.type === 'conveyor' && !n.item) {
      n.item = spawnItemMesh(kind, cell.gx, cell.gz, -0.5);
      return true;
    }
    if (n.type === 'base') {
      if (state[kind] !== undefined) state[kind] += 1;
      return true;
    }
  }
  return false;
}

function updateFurnace(b, dt) {
  const powerMul = b.powered ? 4 : 1;
  const levelMul = b.level === 2 ? 2 : 1;
  const period = FURNACE_PERIOD / (powerMul * levelMul);
  if (b.mesh.userData.fire) {
    const s = 0.9 + Math.sin(performance.now() * 0.008) * 0.15 + (b.processing ? 0.3 : 0);
    b.mesh.userData.fire.scale.setScalar(s);
    b.mesh.userData.fire.material = b.processing ? MAT.hot : MAT.warn;
  }
  if (b.processing) {
    b.timer += dt;
    if (b.timer >= period) {
      b.timer = 0;
      const outputKind = b.processing === 'ironOre' ? 'iron' : 'copper';
      if (tryOutputItem(b, outputKind)) b.processing = null;
    }
  }
  if (!b.processing) {
    const hasIron = b.ironBuffer > 0, hasCopper = b.copperBuffer > 0;
    let next = null;
    if (hasIron && hasCopper) next = b.lastProcessed === 'ironOre' ? 'copperOre' : 'ironOre';
    else if (hasIron) next = 'ironOre';
    else if (hasCopper) next = 'copperOre';
    if (next) {
      if (next === 'ironOre') b.ironBuffer--; else b.copperBuffer--;
      b.processing = next; b.lastProcessed = next; b.timer = 0;
    }
  }
}

function updatePowerPlant(b, dt) {
  if (b.disabled || b.fuel <= 0) {
    b.active = false;
    if (b.mesh.userData.core) b.mesh.userData.core.material = MAT.dark;
    if (b.mesh.userData.glow) b.mesh.userData.glow.material = MAT.dark;
    if (b.mesh.userData.fuelInd) b.mesh.userData.fuelInd.visible = false;
    return;
  }
  b.active = true;
  b.fuelBurnTimer += dt;
  const burnInterval = b.level === 2 ? 20 : 10;
  if (b.fuelBurnTimer >= burnInterval) { b.fuelBurnTimer -= burnInterval; b.fuel--; }
  if (b.mesh.userData.core) b.mesh.userData.core.material = MAT.green;
  if (b.mesh.userData.glow) { b.mesh.userData.glow.material = MAT.green; b.mesh.userData.glow.rotation.z += dt * 2; }
  if (b.mesh.userData.fuelInd) b.mesh.userData.fuelInd.visible = true;
}

function updateBatteryVisual(b, dt, now) {
  const ratio = b.charge / b.maxCharge;
  const inds = b.mesh.userData.chargeIndicators;
  if (inds) for (let i = 0; i < inds.length; i++)
    inds[i].visible = ratio >= (i + 1) / inds.length - 0.001;
  if (b.mesh.userData.spark) {
    b.mesh.userData.spark.visible = b.charge > 0;
    b.mesh.userData.spark.scale.setScalar(1 + Math.sin(now * 0.008) * 0.15);
  }
  if (b.mesh.userData.warnRing) {
    b.mesh.userData.warnRing.rotation.z += dt * 1.5;
    b.mesh.userData.warnRing.material = b.charge > 0 ? MAT.warn : MAT.mid;
  }
}

/* ═══════════════════════════════════════════════════════════
   14. 液化器 / 管道网络
   ═══════════════════════════════════════════════════════════ */
function updateLiquefierVisual(b, now) {
  if (b.mesh.userData.liquid) {
    const s = 1 + Math.sin(now * 0.004) * 0.05;
    b.mesh.userData.liquid.scale.set(s, 1, s);
  }
  if (b.mesh.userData.glow) b.mesh.userData.glow.rotation.z += 0.01;
}

function updatePipeNetwork() {
  const visited = new Set();
  for (const b of buildingsByType.pipe) {
    const key = idx(b.gx, b.gz);
    if (visited.has(key)) continue;
    const pipes = [];
    const queue = [b];
    visited.add(key);
    while (queue.length) {
      const p = queue.shift();
      pipes.push(p);
      for (const d of DIRS) {
        const nx = p.gx + d.x, nz = p.gz + d.z;
        if (!inBounds(nx, nz)) continue;
        const nk = idx(nx, nz);
        if (visited.has(nk)) continue;
        const n = buildingAt(nx, nz);
        if (n && n.type === 'pipe') { visited.add(nk); queue.push(n); }
      }
    }
    const adjacent = new Set();
    for (const pipe of pipes) for (const d of DIRS) {
      const nx = pipe.gx + d.x, nz = pipe.gz + d.z;
      if (!inBounds(nx, nz)) continue;
      const n = buildingAt(nx, nz);
      if (n && n.type !== 'pipe') adjacent.add(n);
    }
    const liqs = [], recvs = [];
    for (const b2 of adjacent) {
      if (b2.type === 'liquefier') liqs.push(b2);
      else recvs.push(b2);
    }
    for (const liq of liqs) for (const target of recvs) pushLiquid(liq, target);
  }
}

function pushLiquid(liq, target) {
  const storage = liq.liquidStorage;
  if (!storage) return;
  for (const kind of ALL_ITEM_KINDS) {
    if (!storage[kind] || storage[kind] <= 0) continue;
    if (target.type === 'furnace') {
      if (kind === 'ironOre' && target.ironBuffer < FURNACE_MAX_BUFFER) {
        const space = FURNACE_MAX_BUFFER - target.ironBuffer;
        const t = Math.min(space, storage[kind]);
        target.ironBuffer += t; storage[kind] -= t;
      } else if (kind === 'copperOre' && target.copperBuffer < FURNACE_MAX_BUFFER) {
        const space = FURNACE_MAX_BUFFER - target.copperBuffer;
        const t = Math.min(space, storage[kind]);
        target.copperBuffer += t; storage[kind] -= t;
      }
    } else if (target.type === 'powerplant') {
      if (kind === 'coal' && target.fuel < target.maxFuel) {
        const space = target.maxFuel - target.fuel;
        const t = Math.min(space, storage[kind]);
        target.fuel += t; storage[kind] -= t;
      }
    } else if (target.type === 'base') {
      if (state[kind] !== undefined) { state[kind] += storage[kind]; storage[kind] = 0; }
    } else if (target.type === 'conveyor') {
      if (!target.item) {
        target.item = spawnItemMesh(kind, target.gx, target.gz, -0.5);
        storage[kind]--;
        return;
      }
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   15. 电力网络
   ═══════════════════════════════════════════════════════════ */
function updatePowerNetwork(dt) {
  for (const b of buildings) b.powered = false;

  // Pass 1: 从发电厂 BFS，标记厂网内的电缆
  const plantVisited = new Set(), queue = [];
  for (const b of buildingsByType.powerplant) {
    if (b.active && !b.disabled) {
      for (let dx = 0; dx < b.w; dx++) for (let dz = 0; dz < b.h; dz++) {
        const k = idx(b.gx + dx, b.gz + dz);
        if (!plantVisited.has(k)) { plantVisited.add(k); queue.push({ gx: b.gx + dx, gz: b.gz + dz }); }
      }
    }
  }
  while (queue.length) {
    const { gx, gz } = queue.shift();
    for (const d of DIRS) {
      const nx = gx + d.x, nz = gz + d.z;
      if (!inBounds(nx, nz)) continue;
      const nk = idx(nx, nz);
      if (plantVisited.has(nk)) continue;
      const n = buildingAt(nx, nz);
      if (n && n.type === 'cable' && !n.disabled) {
        plantVisited.add(nk);
        queue.push({ gx: nx, gz: nz });
      }
    }
  }

  // 检查电网生成器是否在厂网内
  const gridGenPowered = [];
  for (const b of buildingsByType.gridgen) {
    if (b.disabled) continue;
    let inNet = false;
    for (const d of DIRS) {
      const nx = b.gx + d.x, nz = b.gz + d.z;
      if (!inBounds(nx, nz)) continue;
      if (plantVisited.has(idx(nx, nz))) { inNet = true; break; }
      const n = buildingAt(nx, nz);
      if (n && n.type === 'powerplant' && n.active && !n.disabled) { inNet = true; break; }
    }
    if (inNet) gridGenPowered.push(b);
  }

  // 电池充电
  for (const b of buildingsByType.battery) {
    let charging = false;
    for (const d of DIRS) {
      const nx = b.gx + d.x, nz = b.gz + d.z;
      if (!inBounds(nx, nz)) continue;
      if (plantVisited.has(idx(nx, nz))) { charging = true; break; }
      const n = buildingAt(nx, nz);
      if (n && n.type === 'powerplant' && n.active && !n.disabled) { charging = true; break; }
    }
    if (!charging) {
      for (const gg of gridGenPowered) {
        const r = gg.level === 2 ? GRIDGEN_RADIUS_LV2 : GRIDGEN_RADIUS;
        if (Math.abs(b.gx - gg.gx) <= r && Math.abs(b.gz - gg.gz) <= r) { charging = true; break; }
      }
    }
    b.isCharging = charging;
    const chargeMul = b.level === 2 ? 1.5 : 1;
    if (charging) b.charge = Math.min(b.maxCharge, b.charge + BATTERY_CHARGE_RATE * chargeMul * dt);
    else if (b.charge > 0) b.charge = Math.max(0, b.charge - BATTERY_DRAIN_RATE * dt);
  }

  // Pass 2: 从所有电源 BFS
  const sourceVisited = new Set(), sourceQueue = [];
  const addSource = (b) => {
    for (let dx = 0; dx < b.w; dx++) for (let dz = 0; dz < b.h; dz++) {
      const k = idx(b.gx + dx, b.gz + dz);
      if (!sourceVisited.has(k)) { sourceVisited.add(k); sourceQueue.push({ gx: b.gx + dx, gz: b.gz + dz }); }
    }
  };
  for (const b of buildingsByType.powerplant) if (b.active && !b.disabled) addSource(b);
  for (const b of buildingsByType.battery) if (b.charge > 0 && !b.disabled) addSource(b);

  while (sourceQueue.length) {
    const { gx, gz } = sourceQueue.shift();
    for (const d of DIRS) {
      const nx = gx + d.x, nz = gz + d.z;
      if (!inBounds(nx, nz)) continue;
      const nk = idx(nx, nz);
      if (sourceVisited.has(nk)) continue;
      const n = buildingAt(nx, nz);
      if (n && n.type === 'cable' && !n.disabled) {
        sourceVisited.add(nk);
        sourceQueue.push({ gx: nx, gz: nz });
      }
    }
  }

  for (const key of sourceVisited) {
    const gz = Math.floor(key / GRID), gx = key % GRID;
    for (const d of DIRS) {
      const nx = gx + d.x, nz = gz + d.z;
      if (!inBounds(nx, nz)) continue;
      const n = buildingAt(nx, nz);
      if (n) n.powered = true;
    }
  }

  // 电网生成器范围供电
  for (const gg of gridGenPowered) {
    gg.powered = true;
    const r = gg.level === 2 ? GRIDGEN_RADIUS_LV2 : GRIDGEN_RADIUS;
    for (let dx = -r; dx <= r; dx++) {
      for (let dz = -r; dz <= r; dz++) {
        const gx = gg.gx + dx, gz = gg.gz + dz;
        if (!inBounds(gx, gz)) continue;
        const n = buildingAt(gx, gz);
        if (n && !n.disabled) n.powered = true;
      }
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   16. 目标选择 / 炮塔
   ═══════════════════════════════════════════════════════════ */
function findNearestEnemy(x, z, range) {
  let best = null, bestD2 = range * range;
  for (const e of enemies) {
    if (e.hp <= 0) continue;
    const dx = e.pos.x - x, dz = e.pos.z - z;
    const d2 = dx * dx + dz * dz;
    if (d2 < bestD2) { bestD2 = d2; best = e; }
  }
  for (const bs of bosses) {
    if (bs.hp <= 0) continue;
    const dx = bs.pos.x - x, dz = bs.pos.z - z;
    const d2 = dx * dx + dz * dz;
    if (d2 < bestD2) { bestD2 = d2; best = bs; }
  }
  return best;
}

function acquireTarget(x, z, range) {
  // 优先目标检查
  if (priorityTarget && priorityTarget.hp > 0) {
    const dx = priorityTarget.pos.x - x;
    const dz = priorityTarget.pos.z - z;
    if (dx * dx + dz * dz <= range * range) {
      return priorityTarget;
    }
  }
  return findNearestEnemy(x, z, range);
}

function updateTurret(b, dt) {
  const eff = b.powered ? 4 : 1;
  const lvlMul = b.level === 2 ? 1.4 : 1;
  b.cooldown -= dt;
  const bx = tileCenterX(b.gx), bz = tileCenterZ(b.gz);
  const best = acquireTarget(bx, bz, TURRET_RANGE);
  const head = b.mesh.userData.head;
  if (best && head) {
    const targetAngle = Math.atan2(-(best.pos.z - bz), best.pos.x - bx);
    let diff = targetAngle - head.rotation.y;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    head.rotation.y += diff * Math.min(1, dt * 12);
    if (b.cooldown <= 0) {
      b.cooldown = 1 / (TURRET_RATE * eff * lvlMul);
      const mx = bx + Math.cos(head.rotation.y) * 0.65;
      const mz = bz - Math.sin(head.rotation.y) * 0.65;
      spawnBullet(mx, 0.5, mz, best, TURRET_DMG);
      playLaserSound();
    }
  }
}

function updateHighCannon(b, dt) {
  const eff = b.powered ? HIGH_POWER_MUL : 1;
  const lvlMul = b.level === 2 ? 1.4 : 1;
  const damage = TURRET_DMG * HIGH_DMG_MUL * eff * lvlMul;
  const rate = TURRET_RATE * HIGH_RATE_MUL * eff * lvlMul;
  b.cooldown -= dt;
  const bx = tileCenterX(b.gx), bz = tileCenterZ(b.gz);
  const best = acquireTarget(bx, bz, TURRET_RANGE);
  const head = b.mesh.userData.head;
  if (b.mesh.userData.core) {
    const s = 1 + Math.sin(performance.now() * 0.012) * 0.15 * (b.powered ? 1.6 : 1);
    b.mesh.userData.core.scale.setScalar(s);
  }
  if (best && head) {
    const targetAngle = Math.atan2(-(best.pos.z - bz), best.pos.x - bx);
    let diff = targetAngle - head.rotation.y;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    head.rotation.y += diff * Math.min(1, dt * 12);
    if (b.cooldown <= 0) {
      b.cooldown = 1 / rate;
      const mx = bx + Math.cos(head.rotation.y) * 0.8;
      const mz = bz - Math.sin(head.rotation.y) * 0.8;
      spawnBullet(mx, 0.55, mz, best, damage, 1.4);
      playLaserSound();
    }
  }
}

function updateArcCannon(b, dt) {
  if (!b.powered) {
    if (b.mesh.userData.core) b.mesh.userData.core.material = MAT.dark;
    return;
  }
  if (b.mesh.userData.core) b.mesh.userData.core.material = MAT.purple;
  if (b.mesh.userData.emitters) b.mesh.userData.emitters.rotation.y += dt * 1.5;
  b.cooldown -= dt;
  if (b.cooldown > 0) return;
  b.cooldown = 1 / ARC_RATE;
  const bx = tileCenterX(b.gx), bz = tileCenterZ(b.gz);
  const lvlMul = b.level === 2 ? 1.5 : 1;
  const dmg = ARC_DMG * lvlMul;
  const inRange = [];
  for (const e of enemies) {
    if (e.hp <= 0) continue;
    const dx = e.pos.x - bx, dz = e.pos.z - bz;
    if (dx*dx + dz*dz <= ARC_RANGE * ARC_RANGE) inRange.push(e);
  }
  for (const bs of bosses) {
    if (bs.hp <= 0) continue;
    const dx = bs.pos.x - bx, dz = bs.pos.z - bz;
    if (dx*dx + dz*dz <= (ARC_RANGE + 1.5) * (ARC_RANGE + 1.5)) inRange.push(bs);
  }
  if (!inRange.length) return;
  // 优先目标优先
  if (priorityTarget && priorityTarget.hp > 0 && inRange.includes(priorityTarget)) {
    inRange.splice(inRange.indexOf(priorityTarget), 1);
    inRange.unshift(priorityTarget);
  } else {
    inRange.sort((a, b2) => {
      const da = (a.pos.x-bx)**2 + (a.pos.z-bz)**2;
      const db = (b2.pos.x-bx)**2 + (b2.pos.z-bz)**2;
      return da - db;
    });
  }
  const targets = inRange.slice(0, ARC_MAX_TARGETS);
  for (const t of targets) {
    t.hp -= dmg; t.hitFlash = 0.12;
    spawnArcBeam(new THREE.Vector3(bx, 0.75, bz), new THREE.Vector3(t.pos.x, 0.4, t.pos.z));
  }
  playLaserSound();
}

function spawnArcBeam(from, to) {
  const dir = new THREE.Vector3().subVectors(to, from);
  const length = dir.length();
  if (length < 0.05) return;
  const mid = new THREE.Vector3().addVectors(from, to).multiplyScalar(0.5);
  const geo = new THREE.CylinderGeometry(0.045, 0.045, length, 4);
  const mat = MAT.arcBeam.clone();
  const beam = new THREE.Mesh(geo, mat);
  beam.position.copy(mid);
  beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  scene.add(beam);
  arcBeams.push({ mesh: beam, t: 0, duration: 0.15 });
}

const bulletGeo = new THREE.CapsuleGeometry(0.055, 0.32, 4, 6);
bulletGeo.rotateX(Math.PI / 2);
const _v3a = new THREE.Vector3(), _v3b = new THREE.Vector3();

function spawnBullet(x, y, z, target, damage, scale = 1) {
  const mesh = new THREE.Mesh(bulletGeo, MAT.bullet);
  mesh.position.set(x, y, z);
  if (scale !== 1) mesh.scale.setScalar(scale);
  scene.add(mesh);
  bullets.push({ mesh, target, life: 2.5, damage });
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.life -= dt;
    if (!b.target || b.target.hp <= 0) { scene.remove(b.mesh); bullets.splice(i, 1); continue; }
    const dx = b.target.pos.x - b.mesh.position.x;
    const dy = 0.35 - b.mesh.position.y;
    const dz = b.target.pos.z - b.mesh.position.z;
    const distSq = dx*dx + dy*dy + dz*dz;
    const dist = Math.sqrt(distSq);
    if (dist < 0.25 || b.life <= 0) {
      if (dist < 0.6) { b.target.hp -= b.damage; b.target.hitFlash = 0.1; }
      scene.remove(b.mesh); bullets.splice(i, 1);
      continue;
    }
    const step = BULLET_SPEED * dt / dist;
    b.mesh.position.x += dx * step;
    b.mesh.position.y += dy * step;
    b.mesh.position.z += dz * step;
    _v3a.set(b.mesh.position.x + dx, b.mesh.position.y + dy, b.mesh.position.z + dz);
    b.mesh.lookAt(_v3a);
  }
}

function createEnemyMesh() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.IcosahedronGeometry(0.3, 0), MAT.enemyBody);
  body.position.y = 0.36; body.castShadow = true; g.add(body); g.userData.body = body;
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 6), MAT.enemyCore);
  core.position.y = 0.36; g.add(core); g.userData.core = core;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.035, 4, 8), MAT.enemyBody);
  ring.rotation.x = Math.PI / 2; ring.position.y = 0.36; g.add(ring); g.userData.ring = ring;
  return g;
}

function spawnEnemy() {
  const w = state.wave;
  const hp = 26 + w * 9;
  const speed = 1.15 + Math.min(w * 0.045, 0.8);
  const damage = 6 + w * 0.8;
  const side = Math.floor(Math.random() * 4);
  let gx, gz;
  if (side === 0) { gx = Math.floor(Math.random() * GRID); gz = 0; }
  else if (side === 1) { gx = Math.floor(Math.random() * GRID); gz = GRID - 1; }
  else if (side === 2) { gx = 0; gz = Math.floor(Math.random() * GRID); }
  else { gx = GRID - 1; gz = Math.floor(Math.random() * GRID); }
  const mesh = createEnemyMesh();
  const pos = new THREE.Vector3(tileCenterX(gx), 0, tileCenterZ(gz));
  mesh.position.copy(pos);
  scene.add(mesh);
  enemies.push({
    pos, mesh, hp, maxHp: hp, speed, damage,
    attackTimer: 0, attackInterval: 0.85, hitFlash: 0,
    target: new THREE.Vector3(baseBuilding.gx - HALF + 1, 0, baseBuilding.gz - HALF + 1),
  });
}

function enemyDistToBuilding(e, b) {
  const left = b.gx - HALF, right = left + b.w;
  const top = b.gz - HALF, bottom = top + b.h;
  const cx = Math.max(left, Math.min(e.pos.x, right));
  const cz = Math.max(top, Math.min(e.pos.z, bottom));
  return Math.hypot(e.pos.x - cx, e.pos.z - cz);
}

const ENEMY_ATTACK_RANGE = 1.35;

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.hp <= 0) {
      spawnDeathParticles(e.pos.x, 0.5, e.pos.z, 0xff6a7e, 8);
      playExplosionSound(0.5);
      scene.remove(e.mesh);
      enemies.splice(i, 1);
      if (priorityTarget === e) priorityTarget = null;
      continue;
    }
    if (e.hitFlash > 0) { e.hitFlash -= dt; e.mesh.userData.core.material = MAT.bullet; }
    else e.mesh.userData.core.material = MAT.enemyCore;
    e.mesh.userData.body.rotation.y += dt * 1.6;
    e.mesh.userData.ring.rotation.z += dt * 2.2;
    const bob = Math.sin(performance.now() * 0.004 + i) * 0.045;
    e.mesh.userData.body.position.y = 0.36 + bob;
    e.mesh.userData.core.position.y = 0.36 + bob;

    let nearestB = null, nearestD = ENEMY_ATTACK_RANGE;
    for (const b of buildings) {
      const d = enemyDistToBuilding(e, b);
      if (d < nearestD) { nearestD = d; nearestB = b; }
    }
    if (nearestB) {
      e.attackTimer -= dt;
      if (e.attackTimer <= 0) { e.attackTimer = e.attackInterval; damageBuilding(nearestB, e.damage); }
      if (nearestD > 0.55) {
        const cx = nearestB.gx - HALF + nearestB.w / 2;
        const cz = nearestB.gz - HALF + nearestB.h / 2;
        const dx = cx - e.pos.x, dz = cz - e.pos.z;
        const d = Math.hypot(dx, dz);
        if (d > 0.01) { e.pos.x += (dx/d) * e.speed * 0.45 * dt; e.pos.z += (dz/d) * e.speed * 0.45 * dt; }
      }
    } else {
      const dx = e.target.x - e.pos.x, dz = e.target.z - e.pos.z;
      const dist = Math.hypot(dx, dz);
      if (dist > 0.05) {
        const ndx = dx / dist, ndz = dz / dist;
        const step = e.speed * dt;
        const nx = e.pos.x + ndx * step, nz = e.pos.z + ndz * step;
        const t = worldToTile(nx, nz);
        const blocker = inBounds(t.gx, t.gz) ? buildingAt(t.gx, t.gz) : null;
        if (blocker) {
          e.attackTimer -= dt;
          if (e.attackTimer <= 0) { e.attackTimer = e.attackInterval; damageBuilding(blocker, e.damage); }
        } else { e.pos.x = nx; e.pos.z = nz; }
      }
    }
    e.mesh.position.copy(e.pos);
    e.mesh.rotation.y = Math.atan2(e.target.x - e.pos.x, e.target.z - e.pos.z);
  }
}

const limbGeo = new THREE.CylinderGeometry(1, 1, 1, 6);
const _limbStart = new THREE.Vector3(), _limbEnd = new THREE.Vector3(), _limbDir = new THREE.Vector3();
const _upVec = new THREE.Vector3(0, 1, 0);

function updateLimbMesh(mesh, start, end, thickness) {
  _limbDir.subVectors(end, start);
  const len = _limbDir.length();
  if (len < 0.001) { mesh.visible = false; return; }
  mesh.visible = true;
  mesh.position.copy(start).lerp(end, 0.5);
  mesh.scale.set(thickness, len, thickness);
  mesh.quaternion.setFromUnitVectors(_upVec, _limbDir.normalize());
}

function createBossLegMesh(variant, hipAngle) {
  const bodyMat = new THREE.MeshStandardMaterial({
    color: variant.bodyColor, roughness: 0.5, metalness: 0.55, flatShading: true,
  });
  const thigh = new THREE.Mesh(limbGeo, bodyMat); thigh.castShadow = true;
  const shin = new THREE.Mesh(limbGeo, bodyMat); shin.castShadow = true;
  const foot = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 6), bodyMat); foot.castShadow = true;
  scene.add(thigh); scene.add(shin); scene.add(foot);
  return {
    hipAngle, thighMesh: thigh, shinMesh: shin, footMesh: foot,
    currentX: 0, currentZ: 0,
    stepStartX: 0, stepStartZ: 0, stepTargetX: 0, stepTargetZ: 0,
    isStepping: false, stepT: 0, stepDuration: 0.35,
  };
}

function createBossMesh(variant) {
  const V = BOSS_VARIANTS[variant];
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({
    color: V.bodyColor, roughness: 0.55, metalness: 0.5, flatShading: true,
  });
  const body = new THREE.Mesh(new THREE.IcosahedronGeometry(1.3, 1), bodyMat);
  body.position.y = 1.75; body.castShadow = true; group.add(body);
  const coreMat = new THREE.MeshStandardMaterial({
    color: V.coreColor, emissive: V.coreColor, emissiveIntensity: 2.5, roughness: 0.25,
  });
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.55, 14, 12), coreMat);
  core.position.y = 1.75; group.add(core);
  group.userData.core = core;
  for (let i = 0; i < 3; i++) {
    const spike = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.7, 4), bodyMat);
    spike.position.set(-0.4 + i * 0.4, 2.6, 0);
    spike.rotation.z = -0.3;
    spike.castShadow = true;
    group.add(spike);
  }
  const mouthMat = new THREE.MeshStandardMaterial({
    color: 0xff6622, emissive: 0xff2200, emissiveIntensity: 2.5, roughness: 0.3,
  });
  const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 10), mouthMat);
  mouth.position.set(1.15, 1.55, 0); group.add(mouth);
  group.userData.mouth = mouth;
  for (const sz of [-0.35, 0.35]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 6),
      new THREE.MeshStandardMaterial({ color: 0xffddaa, emissive: 0xffaa44, emissiveIntensity: 2.5 }));
    eye.position.set(1.0, 2.1, sz); group.add(eye);
  }
  return group;
}

function spawnBoss(variant) {
  const V = BOSS_VARIANTS[variant];
  const w = state.wave;
  const hp = Math.floor((500 + w * 120) * V.hpMul);
  const side = Math.floor(Math.random() * 4);
  let gx, gz;
  if (side === 0) { gx = Math.floor(Math.random() * GRID); gz = 1; }
  else if (side === 1) { gx = Math.floor(Math.random() * GRID); gz = GRID - 2; }
  else if (side === 2) { gx = 1; gz = Math.floor(Math.random() * GRID); }
  else { gx = GRID - 2; gz = Math.floor(Math.random() * GRID); }

  const pos = new THREE.Vector3(tileCenterX(gx), 0, tileCenterZ(gz));
  const mesh = createBossMesh(variant);
  mesh.position.copy(pos);
  scene.add(mesh);

  const boss = {
    isBoss: true, variant, name: V.name,
    pos, mesh, hp, maxHp: hp,
    bodyRadius: 1.3, speed: V.speed,
    legs: [], facing: 0,
    attackTimer: 0, breathTimer: 3.5, breathActive: 0, breathCone: null,
    hitFlash: 0, deathT: 0, isDying: false,
    target: new THREE.Vector3(baseBuilding.gx - HALF + 1, 0, baseBuilding.gz - HALF + 1),
  };
  for (let i = 0; i < V.legs; i++) {
    const hipAngle = (i / V.legs) * Math.PI * 2;
    const leg = createBossLegMesh(V, hipAngle);
    leg.currentX = pos.x + Math.cos(hipAngle) * 2.0;
    leg.currentZ = pos.z + Math.sin(hipAngle) * 2.0;
    leg.stepTargetX = leg.currentX;
    leg.stepTargetZ = leg.currentZ;
    boss.legs.push(leg);
  }
  bosses.push(boss);
}

function onLegLand(boss, leg) {
  const gx = Math.floor(leg.currentX + HALF);
  const gz = Math.floor(leg.currentZ + HALF);
  if (!inBounds(gx, gz)) return;
  const b = buildingAt(gx, gz);
  if (!b) return;
  if (b.type === 'base') damageBuilding(b, 200);
  else {
    if (b.type === 'battery') batteryExplode(b);
    b.hp = 0;
    b.pendingRemove = true;
    spawnDeathParticles(leg.currentX, 0.5, leg.currentZ, 0xffaa44, 6);
    playExplosionSound(0.8);
  }
}

function onBossDeath(boss) {
  const x = boss.pos.x, z = boss.pos.z;
  const radius = 3;
  for (let dx = -radius; dx <= radius; dx++) {
    for (let dz = -radius; dz <= radius; dz++) {
      if (dx*dx + dz*dz > radius*radius) continue;
      const gx = Math.floor(x + HALF) + dx;
      const gz = Math.floor(z + HALF) + dz;
      if (!inBounds(gx, gz)) continue;
      const b = buildingAt(gx, gz);
      if (!b) continue;
      if (b.type === 'base') damageBuilding(b, 300);
      else damageBuilding(b, 800);
    }
  }
  spawnShockwave(x, z);
  spawnExplosion(x, 1.0, z);
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    spawnExplosion(x + Math.cos(a) * 1.4, 1.5, z + Math.sin(a) * 1.4);
  }
  spawnDeathParticles(x, 1.2, z, 0xff5a6e, 30);
  playExplosionSound(2.0);
}

function spawnShockwave(x, z) {
  const ringGeo = new THREE.RingGeometry(0.3, 0.7, 32);
  ringGeo.rotateX(-Math.PI / 2);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0xffaa44, transparent: true, opacity: 1, side: THREE.DoubleSide, depthWrite: false,
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.set(x, 0.25, z);
  scene.add(ring);
  shockwaves.push({ mesh: ring, t: 0, duration: 0.9 });
}

function updateBossLegs(boss, dt) {
  const rot = boss.facing;
  const bodyR = boss.bodyRadius;
  for (const leg of boss.legs) {
    const hipAngle = rot + leg.hipAngle;
    const hipX = boss.pos.x + Math.cos(hipAngle) * bodyR * 0.8;
    const hipZ = boss.pos.z + Math.sin(hipAngle) * bodyR * 0.8;
    const restX = boss.pos.x + Math.cos(hipAngle) * bodyR * 2.0;
    const restZ = boss.pos.z + Math.sin(hipAngle) * bodyR * 2.0;
    const dx = restX - leg.currentX, dz = restZ - leg.currentZ;
    const dist = Math.hypot(dx, dz);
    if (!leg.isStepping && dist > 0.55) {
      leg.isStepping = true;
      leg.stepT = 0;
      leg.stepStartX = leg.currentX; leg.stepStartZ = leg.currentZ;
      leg.stepTargetX = restX; leg.stepTargetZ = restZ;
    }
    if (leg.isStepping) {
      leg.stepT += dt / leg.stepDuration;
      if (leg.stepT >= 1) {
        leg.stepT = 1; leg.isStepping = false;
        leg.currentX = leg.stepTargetX; leg.currentZ = leg.stepTargetZ;
        onLegLand(boss, leg);
      } else {
        const t = leg.stepT;
        leg.currentX = leg.stepStartX + (leg.stepTargetX - leg.stepStartX) * t;
        leg.currentZ = leg.stepStartZ + (leg.stepTargetZ - leg.stepStartZ) * t;
      }
    }
    const lift = leg.isStepping ? Math.sin(leg.stepT * Math.PI) * 0.9 : 0;
    const kneeX = (hipX + leg.currentX) / 2;
    const kneeZ = (hipZ + leg.currentZ) / 2;
    const kneeY = 1.1 + lift * 0.4;
    _limbStart.set(hipX, 1.4, hipZ);
    _limbEnd.set(kneeX, kneeY, kneeZ);
    updateLimbMesh(leg.thighMesh, _limbStart, _limbEnd, 0.17);
    _limbStart.set(kneeX, kneeY, kneeZ);
    _limbEnd.set(leg.currentX, lift, leg.currentZ);
    updateLimbMesh(leg.shinMesh, _limbStart, _limbEnd, 0.13);
    leg.footMesh.position.set(leg.currentX, lift, leg.currentZ);
  }
}

function updateBossBreath(boss, dt, now) {
  const V = BOSS_VARIANTS[boss.variant];
  if (boss.mesh.userData.mouth) {
    const intensity = boss.breathActive > 0 ? 4 + Math.sin(now * 0.03) * 2 : 2;
    boss.mesh.userData.mouth.material.emissiveIntensity = intensity;
    const s = boss.breathActive > 0 ? 1.25 : 1;
    boss.mesh.userData.mouth.scale.setScalar(s);
  }
  if (boss.mesh.userData.core) {
    const s = 1 + Math.sin(now * 0.008) * 0.1;
    boss.mesh.userData.core.scale.setScalar(s);
  }

  if (boss.breathActive > 0) {
    boss.breathActive -= dt;
    if (!boss.breathCone) {
      const coneGeo = new THREE.ConeGeometry(1.6, 4.5, 16, 1, true);
      coneGeo.rotateZ(-Math.PI / 2);
      coneGeo.translate(2.25, 0, 0);
      const coneMat = new THREE.MeshBasicMaterial({
        color: boss.variant === 'mutated' ? 0xff44aa : 0xff6622,
        transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false,
      });
      const cone = new THREE.Mesh(coneGeo, coneMat);
      scene.add(cone);
      boss.breathCone = cone;
    }
    const mouthWorld = _v3a.copy(boss.pos);
    mouthWorld.x += Math.cos(boss.facing) * 1.2;
    mouthWorld.y = 1.55;
    mouthWorld.z += Math.sin(boss.facing) * 1.2;
    boss.breathCone.position.copy(mouthWorld);
    boss.breathCone.rotation.y = -boss.facing;
    boss.breathCone.visible = true;
    boss.breathCone.material.opacity = 0.45 + Math.sin(now * 0.03) * 0.15;

    const dirX = Math.cos(boss.facing), dirZ = Math.sin(boss.facing);
    for (const b of buildings) {
      const bx = b.gx - HALF + b.w / 2;
      const bz = b.gz - HALF + b.h / 2;
      const dx = bx - boss.pos.x, dz = bz - boss.pos.z;
      const dist = Math.hypot(dx, dz);
      if (dist > 4.5 || dist < 0.01) continue;
      const dot = (dx * dirX + dz * dirZ) / dist;
      if (dot < 0.72) continue;
      if (b.type === 'battery') {
        if (V.breathExplodesBatteries) {
          batteryExplode(b);
          b.hp = 0; b.pendingRemove = true;
        } else damageBuilding(b, 260 * dt);
      } else if (b.type === 'base') damageBuilding(b, 110 * dt);
      else damageBuilding(b, 260 * dt);
    }
  } else {
    if (boss.breathCone) boss.breathCone.visible = false;
  }

  boss.breathTimer -= dt;
  if (boss.breathTimer <= 0 && boss.breathActive <= 0) {
    const dx = boss.target.x - boss.pos.x, dz = boss.target.z - boss.pos.z;
    const d = Math.hypot(dx, dz);
    if (d < 7) { boss.breathTimer = 4.5; boss.breathActive = 1.3; }
    else boss.breathTimer = 1.5;
  }
}

function updateBosses(dt, now) {
  for (let i = bosses.length - 1; i >= 0; i--) {
    const boss = bosses[i];
    const V = BOSS_VARIANTS[boss.variant];

    if (boss.isDying) {
      boss.deathT += dt;
      const t = Math.min(1, boss.deathT / 0.9);
      boss.mesh.position.y = (1 - t) * 2.2;
      boss.mesh.rotation.z = t * 0.5;
      boss.mesh.scale.setScalar(1 - t * 0.4);
      if (t >= 1) {
        onBossDeath(boss);
        boss.mesh.traverse(o => { if (o.isMesh) o.geometry.dispose?.(); });
        scene.remove(boss.mesh);
        for (const leg of boss.legs) {
          scene.remove(leg.thighMesh); scene.remove(leg.shinMesh); scene.remove(leg.footMesh);
        }
        if (boss.breathCone) scene.remove(boss.breathCone);
        bosses.splice(i, 1);
        if (priorityTarget === boss) priorityTarget = null;
      }
      continue;
    }

    if (boss.hp <= 0) { boss.isDying = true; boss.deathT = 0; continue; }

    if (boss.hitFlash > 0) {
      boss.hitFlash -= dt;
      if (boss.mesh.userData.core) boss.mesh.userData.core.material.emissiveIntensity = 5;
    } else {
      if (boss.mesh.userData.core) boss.mesh.userData.core.material.emissiveIntensity = 2.5;
    }

    const dx = boss.target.x - boss.pos.x, dz = boss.target.z - boss.pos.z;
    const dist = Math.hypot(dx, dz);
    if (dist > 0.5) {
      const ndx = dx / dist, ndz = dz / dist;
      let desiredFacing = Math.atan2(ndz, ndx);
      let diff = desiredFacing - boss.facing;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      boss.facing += diff * Math.min(1, dt * 1.5);
      boss.pos.x += ndx * boss.speed * dt;
      boss.pos.z += ndz * boss.speed * dt;
      boss.mesh.position.y = Math.sin(performance.now() * 0.003) * 0.06;
    }
    boss.mesh.position.x = boss.pos.x;
    boss.mesh.position.z = boss.pos.z;
    boss.mesh.rotation.y = -boss.facing;

    updateBossLegs(boss, dt);
    updateBossBreath(boss, dt, now);

    if (V.canHealInGrid) {
      let inGrid = false;
      for (const b of buildings) {
        if ((b.type === 'cable' || b.type === 'gridgen' || b.type === 'powerplant') && !b.disabled) {
          const bx = b.gx - HALF + b.w / 2;
          const bz = b.gz - HALF + b.h / 2;
          if (Math.hypot(bx - boss.pos.x, bz - boss.pos.z) < MECH_HEAL_RANGE) { inGrid = true; break; }
        }
      }
      if (inGrid) boss.hp = Math.min(boss.maxHp, boss.hp + MECH_HEAL_RATE * dt);
      for (const b of buildings) {
        if (b.type === 'cable' || b.type === 'gridgen' || b.type === 'powerplant') {
          const bx = b.gx - HALF + b.w / 2;
          const bz = b.gz - HALF + b.h / 2;
          if (Math.hypot(bx - boss.pos.x, bz - boss.pos.z) < MECH_PARALYZE_RANGE) b.disabled = true;
        }
      }
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   20. 波次系统
   ═══════════════════════════════════════════════════════════ */
function getWaveInterval() {
  const base = Math.max(28, 50 - state.wave * 1.5);
  return state.difficulty === 'easy' ? base * 2 : base;
}

function startWave() {
  state.wave++;
  state.inWave = true;
  state.spawnRemaining = 3 + state.wave * 2;
  state.spawnTimer = 0;
  if (state.wave > BOSS_SPAWN_WAVE && state.wave % BOSS_SPAWN_INTERVAL === 0) {
    const variants = ['original', 'mechanical', 'mutated'];
    const variant = variants[Math.floor(Math.random() * variants.length)];
    spawnBoss(variant);
  }
}

function updateWaves(dt) {
  if (state.gameOver) return;
  if (state.inWave) {
    if (state.spawnRemaining > 0) {
      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0) {
        state.spawnTimer = Math.max(0.28, 0.8 - state.wave * 0.04);
        spawnEnemy();
        state.spawnRemaining--;
      }
    } else if (enemies.length === 0 && bosses.length === 0) {
      state.inWave = false;
      state.researchPoints += 1;
      state.waveTimer = getWaveInterval();
      showSaveToast(`第 ${state.wave} 波已清空 · +1 研究点`);
      refreshTechPanel();
      updateUI();
    }
  } else {
    state.waveTimer -= dt;
    if (state.waveTimer <= 0) startWave();
  }
}

/* ═══════════════════════════════════════════════════════════
   21. 受损外观
   ═══════════════════════════════════════════════════════════ */
function updateBuildingAppearance(b) {
  if (!b.meshMaterials || b.meshMaterials.length === 0) return;
  const ratio = b.hp / b.maxHp;
  const damage = 1 - ratio;
  for (const entry of b.meshMaterials) {
    const { mat, orig } = entry;
    const tint = 1 - damage * 0.5;
    mat.color.copy(orig.color).multiplyScalar(tint);
    if (damage > 0.35) {
      const redAmount = (damage - 0.35) / 0.65;
      mat.emissive.copy(orig.emissive);
      mat.emissive.r += redAmount * 0.5;
      mat.emissiveIntensity = orig.emissiveIntensity + redAmount * 0.6;
    } else {
      mat.emissive.copy(orig.emissive);
      mat.emissiveIntensity = orig.emissiveIntensity;
    }
  }
}

   22. 输入 / 交互
